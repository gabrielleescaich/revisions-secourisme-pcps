<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomie : place les étiquettes</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--surf:#fff;--ink:#1d2433;--mut:#667085;--line:#c9cdd6;--acc:#c8322b;--accs:#fbe3e1;--ok:#1f7a4d;--oks:#dff3e8;--bad:#b42318;--bads:#fde4e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--acc:#ff6b61;--accs:#4a2522;--ok:#5ad19a;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--acc:#ff6b61;--accs:#4a2522;--ok:#5ad19a;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
button{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--accs);border-color:var(--acc);font-weight:600}
section.u{margin-bottom:26px}
h2{font-size:1.05rem;margin:0 0 8px;white-space:pre-line}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:6px}
.imgw{position:relative;container-type:inline-size;max-width:var(--mw);margin:0 auto;overflow:hidden;background:#fff}
.imgw img{display:block;width:100%;height:auto}
.z{position:absolute;transform:translate(-50%,-50%);background:#fffdf7;border:1.5px dashed #8a8f9c;border-radius:4px;padding:0 2px;color:#1d2433;font:600 max(8px,var(--fs)) / 1.05 system-ui,sans-serif;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.z.hl{border-color:var(--acc);background:#fff1ef}
.z.f{border-style:solid;border-color:#5b6b8c;background:#eef2fb}
.z.ok{border-color:#1f7a4d;background:#dff3e8}
.z.ko{border-color:#b42318;background:#fde4e1}
@media (max-width:520px){.imgw{min-width:var(--minw,0px)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px;padding:12px;margin:12px 0;background:var(--surf);border:1px dashed var(--line);border-radius:10px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surf);border:1.5px solid var(--acc);color:var(--ink);cursor:grab;font-weight:600;user-select:none}
.chip.sel{background:var(--acc);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
#score{font-weight:600}
#msg{text-align:center;font-weight:600;color:var(--ok);margin-top:10px;min-height:1.4em}
.note{color:var(--mut);font-size:.85rem;text-align:center;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Anatomie : place les étiquettes</h1>
<p class="sub">Glisse chaque nom sur la bonne case de l’image, ou touche un nom puis la case. Touche une case remplie pour retirer son nom. Sur téléphone, fais glisser l’image sur le côté si besoin.</p>

const $=id=>document.getElementById(id);
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
D.forEach(g=>g.units.forEach(e=>{e.all=e.zones.map(z=>z.t).sort().map((t,i)=>({id:i,t}));e.chips=sh(e.all.slice())}));
const S=D.map(g=>g.units.map(()=>({place:{},res:{}})));
let cur=0,sel=null;
const nOk=(g,i)=>Object.values(S[g][i].res).filter(v=>v==='ok').length;
function put(u,zi,cid){
  const s=S[cur][u];
  for(const k in s.place)if(s.place[k]===cid){delete s.place[k];delete s.res[k]}
  s.place[zi]=cid;delete s.res[zi];sel=null;$('msg').textContent='';draw();
}
function draw(){
  const g=D[cur],y=scrollY,sx=[...document.querySelectorAll('.sc')].map(s=>s.scrollLeft);
  $('tabs').innerHTML='';
  D.forEach((x,i)=>{
    const b=document.createElement('button');
    const tot=x.units.reduce((a,u)=>a+u.zones.length,0),ok=x.units.reduce((a,u,k)=>a+nOk(i,k),0);
    const done=S[i].some(s=>Object.keys(s.res).length);
    b.textContent=x.tab+(done?` (${ok}/${tot})`:'');b.className=i===cur?'on':'';
    b.onclick=()=>{cur=i;sel=null;$('msg').textContent='';draw();scrollTo(0,0)};
    $('tabs').appendChild(b);
  });
  const U=$('units');U.innerHTML='';
  g.units.forEach((e,u)=>{
    const s=S[cur][u],sec=document.createElement('section');sec.className='u';
    const h=document.createElement('h2');h.textContent=e.title;sec.appendChild(h);
    const sc=document.createElement('div');sc.className='sc';
    const w=document.createElement('div');w.className='imgw';
    w.style.setProperty('--mw',e.mw+'px');w.style.setProperty('--minw',e.minw+'px');
    w.innerHTML=`<img src="${e.img}" alt="${e.title}" draggable="false">`;
    e.zones.forEach((z,i)=>{
      const d=document.createElement('button');d.type='button';
      const c=s.place[i]!==undefined?e.all[s.place[i]]:null;
      const mine=sel&&sel.u===u;
      d.className='z'+(c?' f':'')+(s.res[i]?' '+s.res[i]:'')+(mine&&!c?' hl':'');
      d.style.cssText=`left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%;--fs:${e.fs}cqw`;
      d.textContent=c?c.t:'';d.setAttribute('aria-label',c?'Case : '+c.t:'Case vide');
      d.onclick=()=>{if(mine)put(u,i,sel.id);else if(c){delete s.place[i];delete s.res[i];draw()}};
      d.ondragover=ev=>{ev.preventDefault();d.classList.add('hl')};
      d.ondragleave=()=>d.classList.remove('hl');
      d.ondrop=ev=>{ev.preventDefault();const r=(ev.dataTransfer.getData('text/plain')||'').split(':');if(+r[0]===u&&r[1]!==undefined)put(u,i,+r[1])};
      w.appendChild(d);
    });
    sc.appendChild(w);sec.appendChild(sc);
    if(e.note){const n=document.createElement('div');n.className='note';n.textContent=e.note;sec.appendChild(n)}
    const bank=document.createElement('div');bank.className='bank';
    const used=new Set(Object.values(s.place));
    e.chips.filter(c=>!used.has(c.id)).forEach(c=>{
      const b=document.createElement('div');b.className='chip'+(sel&&sel.u===u&&sel.id===c.id?' sel':'');
      b.textContent=c.t;b.draggable=true;b.tabIndex=0;
      b.onclick=()=>{sel=(sel&&sel.u===u&&sel.id===c.id)?null:{u,id:c.id};draw()};
      b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.click()}};
      b.ondragstart=ev=>{ev.dataTransfer.setData('text/plain',u+':'+c.id);sel=null};
      bank.appendChild(b);
    });
    if(!bank.children.length)bank.innerHTML='<span style="color:var(--mut)">Toutes les étiquettes sont placées.</span>';
    sec.appendChild(bank);U.appendChild(sec);
  });
  document.querySelectorAll('.sc').forEach((s,i)=>{if(sx[i])s.scrollLeft=sx[i]});
  scrollTo(0,y);
  const tot=g.units.reduce((a,u)=>a+u.zones.length,0),ok=g.units.reduce((a,u,k)=>a+nOk(cur,k),0);
  $('score').textContent=S[cur].some(s=>Object.keys(s.res).length)?`Score : ${ok} / ${tot}`:'';
}
$('chk').onclick=()=>{
  const g=D[cur];let ok=0,tot=0,placed=0;
  g.units.forEach((e,u)=>{const s=S[cur][u];tot+=e.zones.length;
    e.zones.forEach((z,i)=>{if(s.place[i]!==undefined){placed++;s.res[i]=e.all[s.place[i]].t===z.t?'ok':'ko';if(s.res[i]==='ok')ok++}else delete s.res[i]})});
  draw();
  $('msg').textContent=ok===tot?'Bravo, tout est correct !':(placed<tot?'Il reste des cases vides.':'Corrige les cases en rouge (touche-les pour retirer le nom).');
};
$('ans').onclick=()=>{
  D[cur].units.forEach((e,u)=>{const s=S[cur][u];s.place={};s.res={};const used=new Set();
    e.zones.forEach((z,i)=>{const c=e.all.find(c=>c.t===z.t&&!used.has(c.id));used.add(c.id);s.place[i]=c.id;s.res[i]='ok'})});
  sel=null;$('msg').textContent='';draw();
};
$('rst').onclick=()=>{S[cur]=D[cur].units.map(()=>({place:{},res:{}}));sel=null;$('msg').textContent='';draw()};
draw();
</script>
