<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: onglets par catégorie, une carte à retourner à la fois, navigation dessous */
:root{--qbg:#d6e6fb;--abg:#f6ecd6;--edge:#000;--bg:#f4f6fa;--card:#fff;--fg:#1b2433;--mut:#5b6678;--line:#d5dbe6;--acc:#1f5fbf;--accfg:#fff;--ok:#1d7a46;--okbg:#e3f4ea;--ko:#b3261e;--kobg:#fbe7e5;--back:#e9f0fb;--font:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;--back:#1c2a42;--edge:#e8edf6;--qbg:#1d3a63;--abg:#3b3223;color-scheme:dark}}
:root[data-theme="dark"]{--qbg:#1d3a63;--abg:#3b3223;--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;--back:#1c2a42;--edge:#e8edf6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance}
.intro{color:var(--mut);margin:4px 0 0}
#tabs.tabs{display:flex;margin-bottom:10px;border:2px solid var(--fg);border-radius:12px;overflow:hidden;background:var(--card)}
.tabs .tab{flex:1;min-width:0;border:0;border-radius:0;padding:12px 8px;font:inherit;font-size:1rem;font-weight:700;background:transparent;color:var(--fg);line-height:1.2;min-height:48px;cursor:pointer;text-align:center}
.tabs .tab+.tab{border-left:2px solid var(--fg)}
.tabs .tab:hover{background:var(--back)}
.tabs .tab[aria-selected="true"]{background:var(--fg);color:var(--bg);box-shadow:inset 0 -4px 0 var(--acc)}
.tabs .n{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--line);color:var(--fg)}
.tabs .tab[aria-selected="true"] .n{background:var(--acc);color:var(--accfg)}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.tab:focus-visible,.flip:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.src{margin:18px 0 8px;text-align:left;font-size:.8rem;color:var(--mut);line-height:1.4}.src a{color:var(--mut);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}.src a:hover{text-decoration-thickness:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font-size:.9rem;min-height:38px;padding:6px 12px;background:transparent}
.cnt{font-weight:600;font-variant-numeric:tabular-nums}
.stat{display:none}
.stage{perspective:1200px}
.flip{display:grid;width:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .5s;border-radius:16px}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--edge);border-radius:16px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;gap:12px;background:var(--qbg);min-width:0}
.face.back{transform:rotateY(180deg);background:var(--abg)}
.q.rich{font-weight:400}.q.rich b{font-weight:700}
.tag{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.q{font-size:1.3rem;line-height:1.3;font-weight:600;margin:auto 0;text-wrap:balance}
.tap{color:var(--mut);font-size:.85rem;margin-top:auto}
.bq{font-size:.95rem;color:var(--mut);margin:0}
.ans-img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;background:#fff;margin:auto 0}
ul.ans{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
ul.ans li.nob{list-style:none;margin-left:-1.2em}
ul.ans li{padding-left:2px}
.grade{display:flex;gap:8px}
.grade button{flex:1}
.grade .ok{background:#7fd6a0;border-color:#1d7a46;color:#000;font-weight:700}
.grade .ko{background:#f2928b;border-color:#b3261e;color:#000;font-weight:700}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
.nav button{flex:none}
#gauge{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 10px;border:2px solid var(--acc);border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.15)}.gr{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:10px;font-size:.85rem;font-weight:600}.gr .tr{height:16px;border-radius:8px;background:var(--line);overflow:hidden}.gr .fl{height:100%;border-radius:8px;transition:width .3s}.gr.y .fl{background:var(--ok)}.gr.n .fl{background:var(--ko)}.gr.y{color:var(--ok)}.gr.n{color:var(--ko)}.gr .v{text-align:right;font-variant-numeric:tabular-nums}
#dock button{font-size:.85rem;min-height:38px;padding:6px 12px}
#dock{position:sticky;bottom:0;z-index:15;display:flex;flex-direction:column;gap:8px;background:var(--bg);margin:0 -16px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 10px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body><style>:root{padding-top:24px!important}.home-tab{position:absolute;top:0;left:max(0px,env(safe-area-inset-left,0px));z-index:30;display:inline-block;padding:3px 10px 4px;font:700 .75rem/1.2 Nunito,system-ui,sans-serif;text-decoration:none;color:#0b4f9e;background:#fff;border:2px solid #f7931e;border-top:0;border-radius:0 0 8px 8px;box-shadow:0 2px 4px rgba(0,0,0,.15)}.home-tab:hover,.home-tab:focus-visible{background:#f7931e;color:#14233b}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .home-tab{background:#172236;color:#8fbaf5}}:root[data-theme="dark"] .home-tab{background:#172236;color:#8fbaf5}</style><a class="home-tab" href="index.html">← Accueil</a>
<main>
 <header>
  <h1>Cartes de révision</h1>
  <p class="intro">Lisez la question, répondez de tête, puis touchez la carte pour la retourner.</p>
 </header>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div class="bar">
  <div><div class="cnt" id="cnt" aria-live="polite"></div><div class="stat" id="stat"></div></div>
  <div class="btns">
   <button id="only">Revoir les ratées</button>
   <button id="rst">Recommencer</button>
  </div>
 </div>
 <div id="gauge"></div>
 <div class="stage"><button class="flip" id="flip" aria-live="polite"></button></div>
 <div id="dock">
 <div class="grade" id="grade" hidden>
  <button class="ko" id="no">À revoir</button>
  <button class="ok" id="yes">Je savais</button>
 </div>
 <div class="nav">
  <button id="prev">← Précédente</button>
   <button class="p" id="next">Suivante →</button>
 </div>
 </div>
 <p id="src" class="src"></p>
</main>

e d'un niveau de conscience d'une victime ?", "qb": [["Quels sont les ", 0], ["types de mesure d'un niveau de conscience", 1], [" d'une victime ?", 0]], "a": ["Score de Glasgow", "EVDA/AVPU"]}, {"q": "Quelles sont les différentes échelles de mesure de la douleur ?", "qb": [["Quelles sont les différentes ", 0], ["échelles de mesure de la douleur ", 1], ["?", 0]], "a": ["EVS (échelle verbale simple)", "EN (échelle numérique)", "EVA (échelle visuelle analogique)", "Echelle des 6 visages", "EVENDOL (hétéroévaluation de la douleur)"]}, {"q": "En quoi consiste la mesure de la douleur par l'échelle verbale simple ?", "qb": [["En quoi consiste la ", 0], ["mesure de la douleur par l'échelle verbale simple", 1], [" ?", 0]], "a": ["Demander à la victime de préciser le niveau de sa douleur à l’instant présent en lui donnant une note de 0 à 4 selon les indications ci-dessous :", "0 – Douleur nulle", "1 – Douleur faible", "2 – Douleur modérée", "3 – Douleur intense", "4 – Douleur insupportable"]}, {"q": "En quoi consiste la mesure de la douleur par l'échelle numérique ?", "qb": [["En quoi consiste la ", 0], ["mesure de la douleur par l'échelle numérique", 1], [" ?", 0]], "a": ["Demander à la victime de préciser le niveau de sa douleur à l’instant présent en lui donnant une note de 0 à 10 selon les indications ci-dessous :", "La note « 0 » correspond à une absence de douleur", "La note de 1 à 3 à une douleur faible", "La note de 4 à 5 à une douleur modérée", "La note de 6 à 7 à une douleur forte", "La note de 8 à 10 à une douleur insupportable"]}, {"q": "Indication d'inhalation d'oxygène", "qb": [["Indication d'", 0], ["inhalation d'oxygène", 1]], "a": ["Nécessaire chez toute victime qui présente :", "Détresse respiratoire ou circulatoire", "Intoxication aux fumées d’incendie ou au monoxyde de carbone", "Accident lié à la plongée", "Mesure de la SpO2 qui indique une valeur < 94 %", "Mesure de la SpO2 qui indique une valeur < 89 % chez l’insuffisant respiratoire chronique avec ou sans oxygène à domicile", "Crise douloureuse chez une victime qui présente des antécédents de drépanocytose", "Si les circonstances ne permettent pas de prendre la mesure de la SpO2 (extrémités froides, panne de l’appareil, etc.) : inhalation d’oxygène systématique si la victime présente une détresse vitale, dans l’attente d’un avis médical."]}, {"q": "Indication de dégagement d'urgence", "qb": [["Indication de ", 0], ["dégagement d'urgence", 1]], "a": ["Soustraire une victime à un danger réel, vital, immédiat et non contrôlable", "Rendre possible les gestes d’urgence vitale sur une victime se trouvant dans un lieu ou dans une position ne permettant pas de les réaliser"]}, {"q": "Justification du dégagement d'urgence", "qb": [["Justification du ", 0], ["dégagement d'urgence", 1]], "a": ["But : déplacer, de quelques mètres ou plus, en quelques secondes, la victime jusqu’à un lieu sûr pour permettre de réaliser, en toute sécurité, le bilan, les gestes de secours d’urgence et la surveillance de la victime"]}, {"q": "Comment se fait un dégagement d'urgence chez le jeune enfant et le nourrisson ?", "qb": [["Comment se fait un ", 0], ["dégagement d'urgence", 1], [" chez le jeune enfant et le nourrisson ?", 0]], "a": ["En le portant dans les bras"]}, {"q": "Quels sont les différents types de dégagements d'urgence ? (hors sortie d'un véhicule et dégagement d'un jeune enfant/nourrisson)", "qb": [["Quels sont les différents", 0], [" types de dégagements d'urgence ", 1], ["? (hors sortie d'un véhicule et dégagement d'un jeune enfant/nourrisson)", 0]], "a": ["Traction par les chevilles", "Traction par les poignets", "Traction par les vêtements", "Traction sous les aisselles", "Traction sur le sol par \"équipier relais\""]}, {"q": "Définition d'un accident d'exposition à un risque viral", "qb": [["Définition d'un", 0], [" accident d'exposition à un risque viral", 1]], "a": ["Toute exposition percutanée (par piqûre ou coupure) ou tout contact direct sur une peau lésée ou des muqueuses (bouche, yeux) avec du sang ou un liquide biologique souillé par du sang"]}, {"q": "Indication d'utilisation des emballages spéciaux relatifs aux DASRI", "qb": [["Indication d'utilisation des ", 0], ["emballages spéciaux relatifs aux DASRI", 1]], "a": ["Matériels piquants, coupants et tranchants (aiguilles, scalpels, lames de rasoir…)", "Déchets d’activités de soins fortement imprégné de sang, de sécrétions ou d’excrétions avec risque d’écoulement (compresses, pansements, champs, draps à usage unique…)"]}, {"q": "Signes d'hypothermie", "qb": [["Signes d'", 0], ["hypothermie", 1]], "a": ["1er regard : exposition prolongée au froid ou à une immersion (noyade)", "2ème ou 3ème regard :", "une perte de connaissance", "un arrêt cardiaque", "une détresse neurologique avec désorientation ou confusion", "une détresse respiratoire avec un ralentissement de la respiration", "une détresse circulatoire avec un ralentissement du pouls qui devient très difficile à percevoir", "L’examen met en évidence :", "une température inférieure à 35 °C", "des frissons (surviennent habituellement avant l’apparition de l’hypothermie sévère entre 36 °C et 32 °C)", "l’absence de frisson (hypothermie modérée, sévère et grave), car la disparition du frisson signe l’épuisement de l’organisme qui n’arrive plus à lutter contre le froid", "une peau pâle, froide et sèche"]}, {"q": "Signes d'une hypothermie légère", "qb": [["Signes d'une", 0], [" hypothermie légère", 1]], "a": ["Victime consciente", "Ventilation et FC rapides", "Frissons permanents", "Peau froide"]}, {"q": "Signes d'une hypothermie modérée", "qb": [["Signes d'une ", 0], ["hypothermie modérée", 1]], "a": ["Délire, hallucinations, troubles de la conscience d'aggravation progressive", "Ventilation et FC ralenties", "Frissons disparus, rigidité musculaire modérée"]}, {"q": "Signes d'une hypothermie sévère", "qb": [["Signes d'une ", 0], ["hypothermie sévère", 1]], "a": ["Victime inconsciente", "Pouls difficile à percevoir", "Ventilation et FC lentes", "Rigidité musculaire importante, victime très sensible à toutes mobilisations (peuvent déclencher troubles du rythme ou arrêt cardiaque)"]}, {"q": "Signes d'une hypothermie grave", "qb": [["Signes d'une", 0], [" hypothermie grave", 1]], "a": ["Arrêt cardiaque apparent"]}, {"q": "Définition de la gelure", "qb": [["Définition de la ", 0], ["gelure", 1]], "a": ["Lésions de la peau et des tissus sous-jacents provoquées par un refroidissement local intense suite à une exposition prolongée au froid"]}, {"q": "Aspect des gelures de 1er degré", "qb": [["Aspect des ", 0], ["gelures de 1er degré", 1]], "a": ["Zone atteinte insensible, rouge, peu oedémateuse, mais sans cloques (phlyctènes)", "Après réchauffement : zone se recolore et victime récupère la perte de sensibilité"]}, {"q": "Aspect des gelures de 2e degré", "qb": [["Aspect des ", 0], ["gelures de 2e degré", 1]], "a": ["Zone atteinte localisée, insensible, rouge, oedémateuse, avec cloques remplies d’un liquide clair.", "Après réchauffement : perte de sensibilité persiste et dernières phalanges des doigts ou des orteils restent bleues ou violacées"]}, {"q": "Aspect des gelures de 3e degré", "qb": [["Aspect des", 0], [" gelures de 3e degré", 1]], "a": ["Zone atteinte insensible, aspect bleuté ou noirâtre, remonte le plus souvent au-dessus des dernières phalanges sans atteindre la totalité de la main ou du pied.", "Après réchauffement : persistance d'une anesthésie et apparition de cloques sanglantes (phlyctènes hématiques).", "Irréversibilité des lésions => amputation de la zone la plus atteinte le plus souvent."]}, {"q": "Aspect des gelures de 4e degré", "qb": [["Aspect des ", 0], ["gelures de 4e degré", 1]], "a": ["Zone atteinte extensive, totalement insensible, bleutée et englobe la main ou l’avant-pied sans oedème.", "Après réchauffement : pas de cloques, tissus restent froids et insensibles et certains deviennent nécrotiques.", "Amputation nécessaire."]}, {"q": "Définition d'une brulûre grave (plutôt que simple)", "qb": [["Définition d'une ", 0], ["brulûre grave", 1], [" (plutôt que simple)", 0]], "a": ["Une ou plusieurs cloques dont la surface totale est supérieure à celle de la moitié de la paume", "Destruction plus profonde (aspect blanchâtre ou noirâtre parfois indolore) associée souvent à des cloques et à une rougeur plus ou moins étendue", "Aspect circulaire (qui fait le tour du cou ou d’un membre)", "Localisation (visage ou cou, mains, articulations, voisinage des orifices naturels)", "Rougeur étendue (coup de soleil généralisé par exemple) de la peau chez l’enfant", "Origine chimique, électrique ou radiologique"]}, {"q": "Définition d'une plaie", "qb": [["Définition d'une ", 0], ["plaie", 1]], "a": ["Lésion de la peau avec effraction et atteinte possible des tissus sous-jacents."]}, {"q": "Définition d'une plaie grave (plutôt que simple)", "qb": [["Définition d'une ", 0], ["plaie grave", 1], [" (plutôt que simple)", 0]], "a": ["Hémorragie associée", "Mécanisme pénétrant (objet tranchant ou perforant, morsures, projectiles)", "Localisation (cou, thorax, abdomen, oeil, orifices naturels)", "Aspect (déchiquetée, écrasée)", "Plaies multiples"]}, {"q": "Donner les cinq types d'aspects d'une plaie", "qb": [["Donner les cinq ", 0], ["types d'aspects d'une plaie", 1]], "a": ["Contusion", "Ecorchure", "Coupure", "Plaie punctiforme", "Lacération"]}, {"q": "Quelle est la position d'attente en cas de plaie ?", "qb": [["Quelle est la", 0], [" position d'attente en cas de plaie ", 1], ["?", 0]], "a": ["Plaie au thorax : assise", "Plaie à l'abdomen : allongée, jambes fléchies", "Plaie à l'œil : allongée, yeux fermés, en demandant de ne pas bouger la tête", "Tous les autres cas : allongée"]}, {"q": "Indication d'un pansement stérile", "qb": [["Indication d'un ", 0], ["pansement stérile", 1]], "a": ["Protéger une ou plusieurs plaies étendues", "Protéger les brûlures graves"]}, {"q": "Signes de traumatisme à l'abdomen", "qb": [["Signes de", 0], [" traumatisme à l'abdomen", 1]], "a": ["Douleur spontanée siégeant au niveau d’une partie ou de tout l’abdomen", "Douleur à la palpation prudente des côtes", "Douleur provoquée lors d’une palpation prudente de l’abdomen qui peut être anormalement dur", "Absence de soulèvement de l’abdomen à chaque inspiration", "Contusion ou une plaie plus ou moins importante", "Vomissements de sang rouge (hématémèse)"]}, {"q": "Signes de traumatisme du thorax", "qb": [["Signes de ", 0], ["traumatisme du thorax", 1]], "a": ["Douleur spontanée siégeant au niveau d’une ou plusieurs côtes ou provoquée par les mouvements respiratoires ou la toux", "Emission de crachats de sang rouge", "Douleur à la palpation prudente des côtes", "Plaie avec ou sans bulles sanglantes à l’expiration", "Contusion", "Anomalie du soulèvement de la poitrine", "Déformation nette du thorax", "Toux incessante ou des crachats de sang rouge", "Lésions associées (polytraumatisme)"]}, {"q": "Signes de traumatisme de la face et de la face antérieure du cou", "qb": [["Signes de ", 0], ["traumatisme de la face et de la face antérieure du cou", 1]], "a": ["Douleur de la face, trouble de la vision ou difficulté à avaler", "Détresse respiratoire par obstruction des voies aériennes", "Détresse circulatoire secondaire à une hémorragie externe ou extériorisée", "Oedème de la face ou localisé (oedème des paupières)", "Hématome de la face, un hématome en lunette", "Une ou plusieurs plaies de la face, de la langue ou du cou", "Déformation de la face traduisant une fracture des os de la face, du nez ou de la mandibule", "Saignement du nez ou de la bouche", "Atteinte de l’oeil objectivée par une anomalie des mouvements de l’oeil, la présence de sang sous la cornée, une déformation de la pupille, une plaie de l’oeil avec ou sans corps étranger intraoculaire visible", "Désinsertion ou une fracture de dents"]}, {"q": "Signes de traumatisme des membres", "qb": [["Signes de", 0], [" traumatisme des membres", 1]], "a": ["Perception d’un craquement au moment de la chute ou du choc", "Douleur vive à l’endroit de la blessure ou à côté, augmentée par le mouvement ou la palpation", "Difficulté voire de impossibilité à bouger le membre atteint ou à se déplacer", "Déformation et gonflement visibles au niveau de la lésion"]}, {"q": "Quelle est la position d'attente en cas de traumatisme des membres ?", "qb": [["Quelle est la ", 0], ["position d'attente en cas de traumatisme des membres", 1], [" ?", 0]], "a": ["Membre inférieur : allongée", "Membre supérieur : assise (+ indiquer à la victime de placer le membre atteint contre sa poitrine et de le soutenir avec une main dans la position la moins douloureuse possible)"]}, {"q": "Indication d'application de froid", "qb": [["Indication d'", 0], ["application de froid", 1]], "a": ["Victime consciente qui présente :", "Traumatisme de membre, y compris des articulations, en l’absence de plaie", "Piqûre d’insecte"]}, {"q": "Indication d'immobilisation du membre supérieur au moyen d’écharpes", "qb": [["Indication d'", 0], ["immobilisation du membre supérieur au moyen d’écharpes", 1]], "a": ["Nécessaire chaque fois qu’une victime doit être mobilisée et que des moyens plus appropriés (attelle modulable ou attelle à dépression) ne sont pas disponibles."]}, {"q": "Dans quels cas pose-t-on une écharpe simple (sans contre-écharpe) ?", "qb": [["Dans quels cas pose-t-on une ", 0], ["écharpe simple", 1], [" (sans contre-écharpe) ?", 0]], "a": ["Traumatisme de la main, du poignet ou de l'avant-bras"]}, {"q": "Dans quels cas pose-t-on une écharpe simple et une contre-écharpe ?", "qb": [["Dans quels cas pose-t-on une", 0], [" écharpe simple et une contre-écharpe", 1], [" ?", 0]], "a": ["Traumatisme du bras"]}, {"q": "Dans quels cas pose-t-on une écharpe oblique ?", "qb": [["Dans quels cas pose-t-on une ", 0], ["écharpe oblique", 1], [" ?", 0]], "a": ["Traumatisme de l'épaule (clavicule, homoplate)"]}, {"q": "Indication du maintien de tête en position neutre", "qb": [["Indication du", 0], [" maintien de tête en position neutre", 1]], "a": ["Recommandé dès qu’un traumatisme de la tête, de la nuque ou du dos de la victime est suspecté, dans l’attente d’une éventuelle immobilisation complète de l’axe tête-cou-tronc"]}, {"q": "Quand considère-t-on qu'il y a une lésion du rachis ?", "qb": [["Quand considère-t-on qu'il y a une", 0], [" lésion du rachis", 1], [" ?", 0]], "a": ["Réponses sont qualifiées de non fiables", "Signes d’atteinte du rachis", "Signes d’atteinte de la moelle épinière", "Traumatisme évocateur d’accident à haut risque de lésion du rachis", "65 ans et plus, ou antécédents à risque"]}, {"q": "Indication d'une compression manuelle", "qb": [["Indication d'une ", 0], ["compression manuelle", 1]], "a": ["Devant toute hémorragie externe accessible, quelle que soit sa localisation, et si elle ne présente pas de corps étranger."]}, {"q": "Définition de l'arrêt cardiaque", "qb": [["Définition de l'", 0], ["arrêt cardiaque", 1]], "a": ["Une personne est en arrêt cardiaque lorsque son cœur ne fonctionne plus ou fonctionne d’une façon anarchique, ne permettant plus d’assurer l’oxygénation du cerveau."]}, {"q": "Qu'est-ce qu'une ventilation agonique ?", "qb": [["Qu'est-ce qu'une", 0], [" ventilation agonique", 1], [" ?", 0]], "a": ["Mouvements ventilatoires inefficaces, bruyants, anarchiques et lents (≤ 1 mvt en 10 sec soit 6 mvts/min)"]}, {"q": "A quel niveau se fait la recherche de pouls en cas d'arrêt cardiaque (adulte, enfant, nourrisson) ?", "qb": [["A quel niveau se fait la ", 0], ["recherche de pouls en cas d'arrêt cardiaque", 1], [" (adulte, enfant, nourrisson) ?", 0]], "a": ["Adulte et enfant : carotidien", "Nourrisson : fémoral"]}, {"q": "Symptômes du Trouble de stress aigu", "qb": [["Symptômes du", 0], [" Trouble de stress aigu", 1]], "a": ["Répétition de l’événement initial au travers de souvenirs envahissants (flashbacks), ou de cauchemars", "Evitement de toutes les situations, personnes, endroits … susceptibles de rappeler des souvenirs, pensées ou sentiments étroitement associés à l’événement critique", "Conduites d’hypervigilance comme si l’événement allait se reproduire de façon imminente, et ce malgré l’absence de danger", "Façon de penser plus négative, difficulté à éprouver des sentiments positifs"]}, {"q": "Indication du plan dur", "qb": [["Indication du ", 0], ["plan dur", 1]], "a": ["Essentiellement utilisé pour permettre une extraction d’une victime située dans un endroit difficile d'accès (endroit exigu, véhicule accidenté…).", "Avec immobilisateur de tête : utilisé en l’absence de matelas immobilisateur à dépression, pour immobiliser une victime suspecte d’un traumatisme du rachis.", "Pour allonger une victime suspecte d'un traumatisme du rachis et qui est retrouvée debout."]}, {"q": "Signes de traumatisme du crâne", "qb": [["Signes de ", 0], ["traumatisme du crâne", 1]], "a": ["Au début du bilan :", "Perte de connaissance qui persiste depuis l’accident", "Troubles de la conscience (somnolence, confusion, agitation anormale)", "Convulsions", "Asymétrie pupillaire nette et fixe", "Lors de la poursuite du bilan :", "Céphalées ou d’une douleur spontanée au niveau des os du crâne", "Nausées ou de vomissements", "Perte de la mémoire des faits souvent synonyme d’une perte de connaissance passagère immédiatement après l’accident, parfois relatée par les témoins", "Déficit moteur neurologique", "Plaie du cuir chevelu, un hématome ou une déformation", "Hématome « en lunettes » (autour des yeux) pouvant témoigner d’une fracture des os de la base du crâne", "Otorragie ou une épistaxis. En cas d’otorragie, la compression manuelle est inutile. Vérifier que l’écoulement sanguin vient bien de l’intérieur de l’oreille en la nettoyant avec une compresse", "Lésions associées en particulier de la colonne cervicale"]}, {"q": "Signes de traumatisme du bassin", "qb": [["Signes de ", 0], ["traumatisme du bassin", 1]], "a": ["Douleur spontanée siégeant au niveau du bassin ou dans la partie basse de l’abdomen. Elle est un signe évocateur d’un traumatisme du bassin", "Douleur localisée au niveau du bassin", "Impossibilité de bouger les membres inférieurs en raison de la douleur", "Présence de sang dans les urines ou sur les sousvêtements (liée à l’atteinte de la vessie ou de l’urètre)", "Hématome important au niveau du pubis", "Lésion des organes urogénitaux externes, particulièrement chez l’homme (lésions associées peuvent masquer le traumatisme du bassin)"]}, {"q": "Indications de massage utérin", "qb": [["Indications de ", 0], ["massage utérin", 1]], "a": ["Pour prévenir ou réduire les hémorragies extériorisées immédiate postpartum."]}, {"q": "Indications de refroidissement de la victime", "qb": [["Indications de ", 0], ["refroidissement de la victime", 1]], "a": ["Nécessaire chez une victime qui présente une hyperthermie, par exemple lors d’affections liés à la chaleur."]}, {"q": "Définition de l'intoxication", "qb": [["Définition de l'", 0], ["intoxication", 1]], "a": ["Trouble engendré par la pénétration dans l’organisme d’une substance appelée poison ou toxique."]}, {"q": "Par quels processus le poison peut-il pénétrer dans l'organisme ?", "qb": [["Par quels processus le ", 0], ["poison", 1], [" peut-il pénétrer dans l'organisme ?", 0]], "a": ["Ingestion : Il est avalé et absorbé par le tube digestif (aliments contaminés, médicaments, produits domestiques)", "Inhalation : Il pénètre par les voies respiratoires et est absorbé dans l’organisme par les poumons (gaz toxiques, aérosols)", "Injection : Il pénètre dans l’organisme à l’occasion d’une plaie (venins, piqûres)", "Absorption : Il pénètre dans l’organisme à travers la peau saine (produits industriels : désherbants, pesticides)"]}, {"q": "Définition du traumatisme/syndrome de suspension", "qb": [["Définition du ", 0], ["traumatisme/syndrome de suspension", 1]], "a": ["Toutes les manifestations qui surviennent chez une victime qui est suspendue, immobile, en position verticale pendant une durée prolongée (plus de 5 minutes)."]}, {"q": "Indication d'aide à la marche", "qb": [["Indication d'", 0], ["aide à la marche", 1]], "a": ["Pour aider un blessé léger, qui peut maintenir la station debout, à marcher sur quelques mètres."]}, {"q": "Indication de déplacement d’une victime à l’aide d’une chaise de transport", "qb": [["Indication de déplacement d’une victime à l’aide d’une ", 0], ["chaise de transport", 1]], "a": ["Pas de détresse ou d'atteinte grave", "Peut supporter la position assise"]}, {"q": "Indication de relevage à quatre secouristes", "qb": [["Indication de ", 0], ["relevage à quatre secouristes", 1]], "a": ["Corpulence de la victime le nécessite", "Brancard cuillère ne peut être utilisé pour relever une victime suspecte d’un traumatisme de la colonne vertébrale"]}, {"q": "Définition de l'hémorragie externe", "qb": [["Définition de l'", 0], ["hémorragie externe", 1]], "a": ["Perte de sang qui provient d'une plaie ou d'un orifice naturel et qui ne s'arrête pas spontanément. Elle imbibe de sang un mouchoir de tissu ou de papier en quelques secondes."]}, {"q": "Quel dispositif mettre en place en cas d'hémorragie externe ?", "qb": [["Quel dispositif mettre en place en cas d'", 0], ["hémorragie externe", 1], [" ?", 0]], "a": ["Un pansement compressif si l’hémorragie est contrôlée manuellement et pour se libérer", "Si la compression (manuelle et pansement compressif) est inefficace ou impossible, utiliser soit un garrot si la zone est « garrotable », soit une gaze imbibée d'une substance hémostatique si la zone est « non garrotable »."]}, {"q": "Définition de l'hémorragie extériorisée", "qb": [["Définition de l'", 0], ["hémorragie extériorisée", 1]], "a": ["Epanchement de sang à l’intérieur de l’organisme qui s’extériorise par un orifice naturel (oreille, nez, bouche, voies urinaires, anus, vagin)"]}, {"q": "Quelle est la conduite à tenir en cas d'hémorragie extériorisée par la bouche ?", "qb": [["Quelle est la conduite à tenir en cas d'hémorragie extériorisée par la ", 0], ["bouche", 1], [" ?", 0]], "a": ["Allonger la victime sur le côté :", "De préférence en position strictement horizontale", "En position demi-assise si elle ne supporte pas d’être allongée ou présente des signes de détresse respiratoire."]}, {"q": "Quelle est la conduite à tenir en cas d'hémorragie extériorisée par le conduit de l'oreille ?", "qb": [["Quelle est la conduite à tenir en cas d'hémorragie extériorisée par", 0], [" le", 1], [" ", 0], ["conduit de l'oreille ", 1], ["?", 0]], "a": ["Appliquer la conduite à tenir devant un traumatisme du crâne."]}, {"q": "Quelle est la conduite à tenir en cas d'hémorragie extériorisée par le nez, consécutif à un choc minime (traumatisme local) ?", "qb": [["Quelle est la conduite à tenir en cas d'hémorragie extériorisée par", 0], [" le", 1], [" ", 0], ["nez", 1], [", consécutif à un choc minime (traumatisme local)", 0], [" ", 1], ["?", 0]], "a": ["L’asseoir, tête penchée en avant (ne jamais l’allonger)", "Lui demander de se moucher vigoureusement", "Lui demander de comprimer les deux narines avec les doigts, durant 10 minutes sans relâcher", "Demander un avis médical si :", "Le saignement ne s’arrête pas ou se reproduit", "Le saignement survient après une chute ou un coup", "La victime prend des médicaments, en particulier ceux qui augmentent les saignements"]}, {"q": "Quelle est la conduite à tenir en cas d'hémorragie extériorisée consécutive à un choc violent (traumatisme de la tête et de la face) ?", "qb": [["Quelle est la conduite à tenir en cas d'hémorragie extériorisée consécutive à un ", 0], ["choc violent", 1], [" (traumatisme de la tête et de la face)", 0], [" ", 1], ["?", 0]], "a": ["Appliquer la conduite à tenir devant un traumatisme de la face"]}, {"q": "Quelle est la conduite à tenir en cas d'hémorragie extériorisée vaginale ?", "qb": [["Quelle est la conduite à tenir en cas d'hémorragie extériorisée ", 0], ["vaginale ", 1], ["?", 0]], "a": ["Allonger la victime. Si elle présente une grossesse visible : l’allonger préférentiellement sur le côté gauche.", "Compléter le bilan :", "en identifiant la couleur de l’écoulement (rouge, marron, liquide clair ou trouble)", "en recherchant une éventuelle grossesse et des antécédents de grossesse pathologique (diabète, hypertension artérielle, etc.)", "Proposer à la victime de mettre des serviettes ou des pansements absorbants entre les cuisses."]}, {"q": "Définition de la compression d'un membre", "qb": [["Définition de la ", 0], ["compression d'un membre", 1]], "a": ["Interruption de la circulation sanguine au niveau de masses musculaires comprimées"]}, {"q": "Au bout de combien de temps parle-t-on d'une compression de membre \"prolongée\" ?", "qb": [["Au bout de combien de temps parle-t-on d'une ", 0], ["compression de membre \"prolongée\"", 1], [" ?", 0]], "a": ["Plus de deux heures"]}, {"q": "Qu'est-ce que le \"crush syndrome\" ou \"syndrome des ensevelis\" ?", "qb": [["Qu'est-ce que le ", 0], ["\"crush syndrome\" ou \"syndrome des ensevelis\"", 1], [" ?", 0]], "a": ["Compression prolongée (plus de deux heures) des muscles des membres"]}, {"q": "Indication de compression manuelle", "qb": [["Indication de ", 0], ["compression manuelle", 1]], "a": ["Devant toute hémorragie externe accessible, quelle que soit sa localisation, et si elle ne présente pas de corps étranger."]}, {"q": "Justification de la compression manuelle", "qb": [["Justification de la ", 0], ["compression manuelle", 1]], "a": ["La plupart des hémorragies externes s’arrêtent en appuyant sur la plaie. La compression manuelle est une technique facile et rapide. Elle est très efficace et suffit dans la plupart des cas pour arrêter le saignement."]}, {"q": "Indication de pansement compressif", "qb": [["Indication de", 0], [" pansement compressif", 1]], "a": ["Pour relayer une compression manuelle efficace, lorsque la localisation le permet"]}, {"q": "Indication du garrot", "qb": [["Indication du ", 0], ["garrot", 1]], "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace, impossible ou lors de situations particulières.", "Il ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Justification du garrot", "qb": [["Justification du ", 0], ["garrot", 1]], "a": ["But : arrêter une hémorragie externe en interrompant totalement la circulation du sang du membre, en aval de l’endroit où il est posé"]}, {"q": "Indication de la gaze imbibée de substance hémostatique", "qb": [["Indication de la ", 0], ["gaze imbibée de substance hémostatique", 1]], "a": ["Adaptée pour des hémorragies externes siégeant à la racine d’un membre (creux axillaire, pli de l’aine), au niveau des fesses, du cou et de la tête, et ne permettant pas la mise en place d’un garrot lorsque la compression manuelle continue est inefficace ou impossible."]}, {"q": "Indication des techniques de réchauffement d'une victime", "qb": [["Indication des techniques de ", 0], ["réchauffement d'une victime", 1]], "a": ["Mises en œuvre devant une victime :", "Qui se plaint d’avoir froid et qui peut présenter des signes de lutte contre le froid comme des frissons", "Exposée à une température basse (neige, hivers, chambre froide…)", "Qui présente un ou plusieurs signes de détresse circulatoire", "Qui présente une hémorragie", "Qui présente une hypothermie"]}, {"q": "Quels sont les moyens pour diminuer la déperdition de chaleur ou apporter de la chaleur à la victime ?", "qb": [["Quels sont les moyens pour ", 0], ["diminuer la déperdition de chaleur ou apporter de la chaleur à la victime", 1], [" ?", 0]], "a": ["Envelopper la victime dans un drap et une couverture", "Isoler la victime de tout contact avec une surface ou des objets froids ou humides", "Protéger la victime du vent et de l’humidité", "Réchauffer la victime"]}, {"q": "Définition de l'OVA", "qb": [["Définition de l'", 0], ["OVA", 1]], "a": ["Gêne ou empêchement brutal des mouvements de l’air entre l’extérieur et les poumons, par un corps étranger."]}, {"q": "Indication de compressions thoraciques", "qb": [["Indication de ", 0], ["compressions thoraciques", 1]], "a": ["Nécessaire en cas de :", "Arrêt cardiaque", "Perte de connaissance à la suite d’une obstruction des voies aériennes", "Nouveau-né qui présente une détresse à la naissance"]}, {"q": "Indication de ventilation artificielle", "qb": [["Indication de ", 0], ["ventilation artificielle", 1]], "a": ["Nécessaire, après libération des voies aériennes, en présence d’une victime :", "En arrêt respiratoire", "Présentant une respiration agonique et dont la fréquence respiratoire est inférieure ou égale à six mouvements par minute"]}, {"q": "Définition de la perte de connaissance", "qb": [["Définition de la ", 0], ["perte de connaissance", 1]], "a": ["Perte permanente ou temporaire de l’aptitude à communiquer et à réagir avec d’autres personnes et avec l’environnement"]}, {"q": "Indication de PLS à deux secouristes", "qb": [["Indication de ", 0], ["PLS à deux secouristes", 1]], "a": ["Après avis médical chez toute victime qui a perdu connaissance, respire normalement et est suspecte de traumatisme"]}, {"q": "Indication de PLS à un secouriste", "qb": [["Indication de ", 0], ["PLS à un secouriste", 1]], "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Indication d'administration d'un médicament", "qb": [["Indication d'", 0], ["administration d'un médicament", 1]], "a": ["Si elle le demande, car il lui a été prescrit, ou à la demande du médecin régulateur."]}, {"q": "Définition de la douleur thoracique", "qb": [["Définition de la ", 0], ["douleur thoracique", 1]], "a": ["Signe perçu par une victime qui apparaît de manière aiguë, au repos, ou au cours d’un effort, et siégeant au niveau du thorax."]}, {"q": "Définition de l'AVC (ou attaque cérébrale)", "qb": [["Définition de l'", 0], ["AVC", 1], [" (ou attaque cérébrale)", 0]], "a": ["Déficit neurologique soudain d’origine vasculaire (la circulation sanguine d’une partie du cerveau est interrompue)"]}, {"q": "Définition de la crise convulsive généralisée", "qb": [["Définition de la ", 0], ["crise convulsive généralisée", 1]], "a": ["Perturbation de l’activité électrique cérébrale qui se traduit extérieurement par une perte de connaissance et/ou un regard fixe accompagné de mouvements musculaires incontrôlés de tout le corps (convulsion généralisée)."]}, {"q": "Définition de la crise d'asthme", "qb": [["Définition de la", 0], [" crise d'asthme", 1]], "a": ["Détresse respiratoire provoquée par une inflammation et une contraction des fibres musculaires lisses des bronchioles (petites bronches) qui entraîne un rétrécissement brutal de leur calibre."]}, {"q": "Définitions des piqûres et morsures", "qb": [["Définitions des ", 0], ["piqûres et morsures", 1]], "a": ["Piqûres : atteintes provoquées par certains insectes ou par certains animaux marins", "Morsures : plaies provoquées par des dents ou des crochets et concerne donc l’Homme, les animaux domestiques ou sauvages et les serpents"]}, {"q": "Définitions de la pendaison et de la strangulation", "qb": [["Définitions de la ", 0], ["pendaison", 1], [" et de la ", 0], ["strangulation", 1]], "a": ["Pendaison : suspension du corps par le cou", "Strangulation : constriction du cou ou pression sur la gorge"]}, {"q": "Définition des lésions de blast", "qb": [["Définition des", 0], [" lésions de blast", 1]], "a": ["Lésions anatomiques générées à la suite d’une forte explosion"]}, {"q": "Donner les quatre types de lésions de blast", "qb": [["Donner les quatre types de", 0], [" lésions de blast", 1]], "a": ["Blast primaire : lésions provoquées par l’onde de choc. Elles peuvent se produire à l’air libre, dans l’eau ou au contact de surfaces solides.", "Blast secondaire : lésions induites par la projection de matériaux sur la victime, en raison du déplacement d’air généré par l’explosion (souffle).", "Blast tertiaire : lésions provoquées par la projection de la victime elle-même si le souffle est très puissant.", "Blast quaternaire : lésions induites par l’explosion elle-même, par brûlure externe ou des voies aériennes, par intoxication due aux fumées ou aux produits chimiques."]}, {"q": "Définition de la foudre", "qb": [["Définition de la ", 0], ["foudre", 1]], "a": ["Décharge électrique entre le nuage et la terre"]}, {"q": "Définition du relevage", "qb": [["Définition du ", 0], ["relevage", 1]], "a": ["Action qui consiste à placer une victime sur un brancard, directement ou à l'aide d'un dispositif particulier de relevage afin d’assurer son déplacement (brancardage)"]}, {"q": "Définition de adulte, enfant, nourrisson, nouveau-né", "qb": [["Définition de", 0], [" adulte, enfant, nourrisson, nouveau-né", 1]], "a": ["Adulte : ressemblant à un adulte morphologiquement", "Enfant : ressemblant à un enfant, pouvant tenir sur la cuisse du secouriste", "Nourrisson : ressemblant à un nourrisson, pouvant tenir sur l'avant-bras du secouriste", "Nouveau-né : ressemblant à un nouveau-né de quelques semaines, peut tenir sur l’avant-bras du secouriste"]}]}, {"cat": "Actions solidaires et sociales", "items": [{"q": "Lieux interdits lors des maraudes locales", "qb": [["Lieux interdits", 1], [" lors des maraudes locales", 0]], "a": ["lieux privés", "bois", "parcs et jardins", "métros et gares", "parkings", "souterrains", "périphérique", "quais de Seine"]}, {"q": "Lieux interdits lors des maraudes locales spécifiques à Paris 10", "qb": [["Lieux interdits", 1], [" lors des maraudes locales spécifiques à Paris 10", 0]], "a": ["gare du Nord", "gare de l'Est", "place de la République"]}, {"q": "Matériel indispensable en maraude locale", "qb": [["Matériel indispensable ", 1], ["en maraude locale", 0]], "a": ["radio portative", "DSA", "Lot V si maraude en VL", "1 GHV par secouriste si maraude en VL ou vélo"]}, {"q": "Matériel facultatif en maraude locale", "qb": [["Matériel facultatif ", 1], ["en maraude locale", 0]], "a": ["Denrées alimentaires", "Bouteilles d'eau", "Thermos d'eau chaude", "\"Guide solidarité\" édité par la Mairie de Paris", "Produits d'hygiène", "Vêtements", "Duvets"]}, {"q": "Vers quelles structures orienter une personne qui n’a pas de domicile et souhaite commencer des démarches de réinsertion pour qu'elle soit suivie par une assistante sociale ?", "qb": [["Vers quelles ", 0], ["structures", 1], [" orienter une personne qui n’a pas de domicile et souhaite commencer des démarches de réinsertion pour qu'elle soit suivie par une assistante sociale ?", 0]], "a": ["Une des trois PSA ou un ESI"]}, {"q": "Vers quelles structures orienter une personne précaire mais ayant un domicile et qui souhaite commencer des démarches de réinsertion pour qu'elle soit suivie par une assistante sociale ?", "qb": [["Vers quelles ", 0], ["structures", 1], [" orienter une personne précaire mais ayant un domicile et qui souhaite commencer des démarches de réinsertion pour qu'elle soit suivie par une assistante sociale ?", 0]], "a": ["CASVP et SSP"]}, {"q": "Quelles prestations sociales peuvent être demandées par les bénéficiaires et quels sont les critères pour les demander ?", "qb": [["Quelles", 0], [" prestations sociales", 1], [" peuvent être demandées par les bénéficiaires et quels sont les critères pour les demander ?", 0]], "a": ["RSA (Revenu de solidarité active) - Plus de 25 ans ; 18-24 ans si parents isolés ou après une certaine durée d’activité professionnelle.", "PUMA (Protection universelle maladie) (ex CMU) - Prise en charge des frais de santé pour tous les bénéficiaires de la Sécurité sociale.", "AME (Aide médicale d’État) - Accès aux soins pour les étrangers en situation irrégulière.", "AAH (Allocation aux adultes handicapés) - Personnes avec un taux d’incapacité de plus de 50 %.", "Tarification « transport solidarité » (Île-de-France)", "FAJP (Fonds d’aide aux jeunes parisiens) - Parisiens de 18 à 25 ans ; soutien aux démarches d’insertion ; non cumulable avec d’autres aides financières de droit commun.", "CSS (Complémentaire santé solidaire) (ex CMU-C)"]}, {"q": "Quelles sont les structures d'accueil des personnes sans-abri ?", "qb": [["Quelles sont les ", 0], ["structures d'accueil ", 1], ["des personnes sans-abri ?", 0]], "a": ["Permanences, services et espaces départementaux : PSA (Permanences sociales d’Accueil) à Paris = Services sociaux et administratifs pour accompagner vers la réinsertion sociale.", "ESI (Espaces Solidarités Insertion) [75 seulement]. Dans le Xe : Chez M. Vincent (Aux captifs la libération) 10 rue Rocroy ; Maison de la rue Bichat (Emmaüs) 35 rue Bichat = Accueil de jour, prestations sanitaires, sociales, médicales, paramédicales, moments de convivialité.", "CAARUD (Centres d’accueil et d’accompagnement à la réduction des risques pour usagers de drogue)", "CSAPA (Centres de soins, d’accompagnement et de prévention en addictologie) = Prise en charge médicale, psychologique, sociale et éducative des usagers de drogue."]}, {"q": "Quel est le but de la MASP ?", "qb": [["Quel est le but de la ", 0], ["MASP", 1], [" ?", 0]], "a": ["Rétablir la gestion autonome des prestations sociales de l’individu"]}, {"q": "Quelle est l'adresse du service de domiciliation du CASVP ?", "qb": [["Quelle est l'adresse du", 0], [" service de domiciliation du CASVP ", 1], ["?", 0]], "a": ["\"Paris Adresse\" (25 rue des Renaudes, 75017)"]}, {"q": "Quels sont les ESI dans le Xe ?", "qb": [["Quels sont les ", 0], ["ESI", 1], [" dans le Xe ?", 0]], "a": ["Chez M. Vincent (Aux captifs la libération) – 10 rue Rocroy", "Maison de la rue Bichat (Emmaüs) – 35 rue Bichat", "Pause 10 – Emmaus Solidarité – 206 quai de Valmy, 75010"]}, {"q": "Quelles sont les fonctions des ESI ?", "qb": [["Quelles sont les", 0], [" fonctions des ESI ", 1], ["?", 0]], "a": ["Accueil de jour, prestations sanitaires, sociales, médicales, paramédicales, moments de convivialité"]}, {"q": "Liste des remontées à faire immédiatement au 115", "qb": [["Liste des ", 0], ["remontées à faire immédiatement au 115", 1]], "a": ["Famille à la rue", "Personne sans-abri en détresse psychique", "Blessure et refus d’aller à l’hôpital ou remet à plus tard", "Situation sanitaire très dégradée mais pas besoin de secours publics", "Demande de mise à l’abri de courte durée (1 nuit)", "Tout autre cas où le CE2S l’estime nécessaire"]}, {"q": "Liste des remontées à faire à l’ACSSO pour sollicitation du SIAO", "qb": [["Liste des ", 0], ["remontées à faire à l’ACSSO pour sollicitation du SIAO", 1]], "a": ["Souhaite bénéficier d’aide ou de démarches sociales pour la 1ère fois", "Souhaite être suivi par les services sociaux", "Souhaite bénéficier d’une aide pour lutter contre une addiction", "Systématiquement intoxiqué (alcool/drogue) lors des rencontres, mais contact possible", "Tout autre cas où le CE2S l’estime nécessaire"]}, {"q": "CAT en cas d'accident matériel ou corporel de l’équipe", "qb": [["CAT en cas d'", 0], ["accident matériel ou corporel de l’équipe", 1]], "a": ["Baliser la zone + s’assurer de la sécurité (GHV, cônes…)", "Vérifier le nombre et l’état des victimes ⇒ gestes de secours et contact des secours publics si nécessaire", "Appel VISU", "Constat amiable (police si l’autre véhicule refuse)", "Rendre compte à AUTO et ACSSO", "Si véhicule indisponible → cas « Panne »"]}, {"q": "CAT en cas de mise à la rue récente", "qb": [["CAT en cas de ", 0], ["mise à la rue récente", 1]], "a": ["Renseigner sur les dispositifs possibles", "Contacter le 115 et transmettre les infos nécessaires si la personne y consent", "Être empathique"]}, {"q": "CAT en cas de détresse psychique", "qb": [["CAT en cas de ", 0], ["détresse psychique", 1]], "a": ["Évaluer la détresse psychique + le risque pour lui et pour les autres", "Si pas de risque immédiat → faire une remontée à l’ACSSO (qui fera une remontée au SIAO, qui pourra missionner une maraude EMPP)", "Si risque pour lui ou pour des tiers → s’assurer de la sécurité avant d’intervenir et contacter les secours publics"]}, {"q": "CAT en cas de famille avec enfants à la rue", "qb": [["CAT en cas de ", 0], ["famille avec enfants à la rue", 1]], "a": ["Évaluer l’état de santé de la famille, notamment des enfants (dénutrition, déshydratation)", "Appeler le 115", "Informer la famille de la suite donnée + lui recommander de ne pas se déplacer si une maraude doit venir la chercher ultérieurement"]}, {"q": "CAT en cas d'intervention inopinée", "qb": [["CAT en cas d'", 0], ["intervention inopinée", 1]], "a": ["Baliser la zone et s’assurer de pouvoir intervenir en sécurité (GHV, parka, cônes, etc.)", "Vérifier le nombre et l’état des victimes", "Si nécessaire, gestes de secours et contacter les secours publics", "Contacter VISU", "Rendre compte à AUTO et ACSSO"]}, {"q": "CAT en cas d'agression d'un secouriste", "qb": [["CAT en cas d'", 0], ["agression d'un secouriste", 1]], "a": ["Se mettre immédiatement en sécurité : se replier dans le VL et quitter les lieux", "Bilan de l’équipier. Si besoin : secours publics", "Demander la police", "Appel VISU + rendre compte à AUTO et ACSSO", "À la discrétion du CE2S : interrompre la maraude et entamer d’éventuelles démarches judiciaires", "A posteriori : s’interroger sur la manière dont l’échange a évolué vers la violence et réfléchir aux actions qui auraient pu permettre d’éviter cela"]}, {"q": "CAT en cas de panne", "qb": [["CAT en cas de ", 0], ["panne", 1]], "a": ["Baliser la zone et s’assurer de pouvoir intervenir en sécurité", "Essayer de réparer la panne en fonction des compétences de l’équipage", "Si réparation impossible : contacter VISU pour qu’il envoie le CAST ou oriente vers l’assurance", "Rendre compte à AUTO, ACSSO, TECH", "Organiser avec l’assurance ou en interne le retour des secouristes au local"]}, {"q": "CAT en cas de mineur isolé à la rue", "qb": [["CAT en cas de", 0], [" mineur isolé à la rue", 1]], "a": ["Se renseigner sur la situation familiale", "Expliquer qu’il sera nécessaire de le mettre à l’abri via la police, pour le protéger d’une situation de danger", "Contacter la police pour signaler la situation après avoir informé le mineur", "Ne pas le retenir ni le poursuivre s’il s’enfuit → noter sa description (vêtements, signes distinctifs) + appel VISU"]}, {"q": "CAT en cas de sans-abri nécessitant des soins", "qb": [["CAT en cas de ", 0], ["sans-abri nécessitant des soins", 1]], "a": ["Signaler la situation au 115 pour intervention d’une maraude médicale → Informer l’ACSSO après la maraude.", "Lui indiquer qu’il peut se rendre à la PASS d’un hôpital", "Lui proposer une orientation vers un ESI", "Lui rappeler ses droits en matière d’aide médicale (PUMA, C2S, etc.)"]}]}, {"cat": "PSC", "items": [{"q": "Indication de libération des voies aériennes", "qb": [["Indication de ", 0], ["libération des voies aériennes", 1]], "a": ["Réalisée systématiquement avant de pouvoir rechercher la respiration chez une victime qui ne répond ou ne réagit à aucune sollicitation verbale ou physique."]}, {"q": "Définition d'une brulûre grave (plutôt que simple)", "qb": [["Définition d'une ", 0], ["brulûre grave ", 1], ["(plutôt que simple)", 0]], "a": ["Une ou plusieurs cloques dont la surface totale est supérieure à celle de la moitié de la paume de la main de la victime", "Destruction plus profonde (aspect blanchâtre ou noirâtre parfois indolore) associée souvent à des cloques et à une rougeur plus ou moins étendue", "Aspect circulaire (qui fait le tour du cou ou d’un membre)", "Localisation (visage ou le cou, les mains, les articulations ou au voisinage des orifices naturels)", "Rougeur étendue (un coup de soleil généralisé par exemple) de la peau chez l’enfant", "Brûlure d’origine chimique, électrique ou radiologique"]}, {"q": "Définition d'une plaie", "qb": [["Définition d'une ", 0], ["plaie", 1]], "a": ["Lésion de la peau, revêtement protecteur du corps, avec une atteinte possible des tissus situés dessous."]}, {"q": "Définition/signes d'une plaie grave (plutôt que simple)", "qb": [["Définition/signes d'une ", 0], ["plaie grave", 1], [" (plutôt que simple)", 0]], "a": ["Hémorragie associée ;", "Mécanisme pénétrant (objet tranchant ou perforant, morsures, projectiles, injection de liquide sous pression)", "Localisation (thoracique, abdominale, oculaire ou proche d’un orifice naturel)", "Aspect (déchiqueté, écrasé)", "Multiplicité des plaies"]}, {"q": "Définition des traumatismes/atteintes traumatiques", "qb": [["Définition des ", 0], ["traumatismes/atteintes traumatiques", 1]], "a": ["Lésions des os (fractures), des articulations (entorses ou luxations), des organes ou de la peau."]}, {"q": "Indication d'une compression", "qb": [["Indication d'une ", 0], ["compression", 1]], "a": ["Sur toute plaie qui saigne abondamment"]}, {"q": "Indication de pose d'un garrot", "qb": [["Indication de pose d'un ", 0], ["garrot", 1]], "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace ou impossible.", "Ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Définition de l'arrêt cardiaque", "qb": [["Définition de l'", 0], ["arrêt cardiaque", 1]], "a": ["Une personne est en arrêt cardiaque lorsque son coeur ne fonctionne plus ou fonctionne d’une façon anarchique, ne permettant plus d’assurer l’oxygénation du cerveau."]}, {"q": "Quelle est la principale maladie du cœur causant des arrêts cardiaques chez l'adulte ?", "qb": [["Quelle est la principale ", 0], ["maladie du cœur causant des arrêts cardiaques", 1], [" chez l'adulte ?", 0]], "a": ["Infarctus de myocarde"]}, {"q": "Indication de PLS", "qb": [["Indication de ", 0], ["PLS", 1]], "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Définition de l'hémorragie", "qb": [["Définition de l'", 0], ["hémorragie", 1]], "a": ["Perte de sang qui provient d'une plaie ou d'un orifice naturel et qui ne s'arrête pas spontanément. Elle imbibe de sang un mouchoir de tissu ou de papier en quelques secondes."]}, {"q": "Risques liés à une hémorragie", "qb": [["Risques liés à une ", 0], ["hémorragie", 1]], "a": ["Pour la victime : détresse circulatoire ou un arrêt cardiaque par une diminution importante de la quantité de sang dans l'organisme", "Pour le secouriste : être infecté par une maladie transmissible s'il présente des effractions cutanées (plaies, piqûres) ou en cas de projection sur les muqueuses (bouche, yeux)"]}, {"q": "Indication de compression", "qb": [["Indication de ", 0], ["compression", 1]], "a": ["Sur toute plaie qui saigne abondamment"]}, {"q": "Justification de la compression", "qb": [["Justification de la ", 0], ["compression", 1]], "a": ["La compression des vaisseaux sanguins, au niveau d’une plaie, arrête le saignement."]}, {"q": "Indication du garrot", "qb": [["Indication du ", 0], ["garrot", 1]], "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace ou impossible.", "Il ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Définition de l'OVA", "qb": [["Définition de l'", 0], ["OVA", 1]], "a": ["Gêne ou empêchement brutal des mouvements de l’air entre l’extérieur et les poumons, par un corps étranger."]}, {"q": "Justification de la désobstruction par des claques dans le dos", "qb": [["Justification de la ", 0], ["désobstruction par des claques dans le dos", 1]], "a": ["But : provoquer un mouvement de toux pour débloquer et expulser le corps étranger qui obstrue les voies aériennes"]}, {"q": "Justification de la désobstruction par des compressions abdominales", "qb": [["Justification de la ", 0], ["désobstruction par des compressions", 1], [" abdominales", 0]], "a": ["But : comprimer l’air contenu dans les poumons de la victime afin d’expulser le corps étranger par un effet de « piston »"]}, {"q": "Indication de compressions thoraciques", "qb": [["Indication de ", 0], ["compressions thoraciques", 1]], "a": ["Nécessaires chaque fois qu’une victime :", "Présente un arrêt cardiaque", "A perdu connaissance à la suite d’une obstruction des voies aériennes."]}, {"q": "Indication de défibrillation", "qb": [["Indication de ", 0], ["défibrillation", 1]], "a": ["Victime en arrêt cardiaque"]}, {"q": "Définition de la perte de connaissance", "qb": [["Définition de la ", 0], ["perte de connaissance", 1]], "a": ["Une personne a perdu connaissance lorsqu'elle ne répond et ne réagit à aucune sollicitation verbale ou physique, mais respire."]}, {"q": "Indication de PLS", "qb": [["Indication de ", 0], ["PLS", 1]], "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Définition du malaise", "qb": [["Définition du ", 0], ["malaise", 1]], "a": ["Sensation pénible traduisant un trouble du fonctionnement de l’organisme, sans pouvoir en identifier obligatoirement l’origine."]}, {"q": "Indication de manœuvres physiques", "qb": [["Indication de", 0], [" manœuvres physiques", 1]], "a": ["Dès que la victime reconnait des signes annonciateurs d’une perte de connaissance imminente."]}, {"q": "Indication de la désobstruction par des compressions thoraciques", "qb": [["Indication de la ", 0], ["désobstruction par des compressions", 1], [" thoraciques", 0]], "a": ["En cas d’obstruction totale des voies aériennes par un corps étranger :", "Lorsqu’il est impossible d’encercler l’abdomen de la victime (personne obèse ; femme enceinte ; personne alitée ou allongée, difficilement mobilisable)", "Chez une victime qui peut tenir sur l’avant-bras du secouriste"]}]}];
const $=id=>document.getElementById(id);
let cur=0,idx=0,onlyMissed=false;
const shuf=n=>{const o=Array.from({length:n},(_,i)=>i);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};
const S=DATA.map(t=>({order:shuf(t.items.length),res:{}}));
const deck=()=>{const s=S[cur];return onlyMissed?s.order.filter(i=>s.res[i]===0):s.order;};
function tabs(){
 $('tabs').innerHTML='';
 DATA.forEach((t,i)=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected',i===cur);
  b.innerHTML='';b.append(t.cat+' ');const nn=document.createElement('span');nn.className='n';nn.textContent=t.items.length;b.appendChild(nn);b.onclick=()=>{cur=i;idx=0;onlyMissed=false;render();};$('tabs').appendChild(b);});
}
function gauge(){
 const s=S[cur],n=DATA[cur].items.length;let y=0,k=0;
 for(let i=0;i<n;i++){const v=s.res[i];if(v===1)y++;else if(v===0)k++}
 const row=(c,l,v)=>'<div class="gr '+c+'"><span>'+l+'</span><div class="tr"><div class="fl" style="width:'+(100*v/n)+'%"></div></div><span class="v">'+v+' / '+n+'</span></div>';
 const g=$('gauge');g.innerHTML=row('y','Réussi',y)+row('n','Raté',k);
 g.setAttribute('aria-label',y+' sues et '+k+' à revoir sur '+n+' cartes');
}
function render(){
 tabs();const d=deck(),s=S[cur];gauge();
 {const SRC={'Opérationnel':'Source : <a href="https://drloser123.github.io/referentiel-pse/" target="_blank" rel="noopener">Références techniques nationales PSE&nbsp;↗</a>','PSC':'Source : Références techniques nationales PSC','Actions solidaires et sociales':'Sources :<br>FR DA-01-10<br>E-learning CE2S (octobre 2026)<br>Guide du maraudeur PCPS 2020'};$('src').innerHTML=SRC[DATA[cur].cat]||'';}
 $('only').textContent=onlyMissed?'Toutes les cartes':'Revoir les ratées';
 $('only').disabled=!onlyMissed&&!Object.values(s.res).includes(0);
 const f=$('flip');f.classList.remove('on');$('grade').hidden=true;
 if(!d.length){f.innerHTML='<div class="face"><p class="q">Aucune carte à revoir.</p></div>';$('cnt').textContent='0 / 0';$('stat').textContent='';$('prev').disabled=$('next').disabled=true;return;}
 if(idx>=d.length)idx=d.length-1;
 gauge();
 const it=DATA[cur].items[d[idx]];
 f.innerHTML='';
 const fr=document.createElement('div');fr.className='face front';
 fr.innerHTML='<span class="tag">Question</span><p class="q"></p><span class="tap">Touchez pour retourner</span>';{const qe=fr.querySelector('.q');if(it.qb){qe.classList.add('rich');it.qb.forEach(([s,b])=>{if(b){const e=document.createElement('b');e.textContent=s;qe.appendChild(e)}else qe.appendChild(document.createTextNode(s))})}else qe.textContent=it.q;}
 const bk=document.createElement('div');bk.className='face back';
 bk.innerHTML='<span class="tag">Réponse</span><p class="bq"></p><ul class="ans"></ul>';bk.querySelector('.bq').textContent=it.q;
 const ul=bk.querySelector('ul');it.a.forEach(x=>{const li=document.createElement('li');const c=x.indexOf(':');if(c>0){const b=document.createElement('strong');b.textContent=x.slice(0,c).trimEnd();li.append(b,document.createTextNode(x.slice(c).replace(/^/,x.slice(b.textContent.length,c))));}else li.textContent=x;if(/:\s*$/.test(x))li.className='nob';ul.appendChild(li);});if(it.img){ul.remove();const im=document.createElement('img');im.className='ans-img';im.src=it.img;im.alt='Réponse : '+it.q;bk.appendChild(im);}
 f.append(fr,bk);bk.setAttribute('aria-hidden','true');
 $('cnt').textContent='Carte '+(idx+1)+' / '+d.length;
 const r=Object.values(s.res);$('stat').textContent=r.filter(v=>v===1).length+' sues · '+r.filter(v=>v===0).length+' à revoir';
 $('prev').disabled=idx===0;$('next').disabled=idx===d.length-1;
}
function flip(){const f=$('flip');if(!f.querySelector('.face'))return;const on=f.classList.toggle('on');$('grade').hidden=!on;
 f.querySelector('.front').setAttribute('aria-hidden',on);f.querySelector('.back').setAttribute('aria-hidden',!on);}
function go(n){const d=deck();idx=Math.max(0,Math.min(d.length-1,idx+n));render();}
function grade(v){const d=deck();if(!d.length)return;S[cur].res[d[idx]]=v;if(idx<d.length-1&&!onlyMissed){idx++;}else if(onlyMissed&&v===1){}else if(idx<d.length-1)idx++;render();}
$('flip').onclick=flip;
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('yes').onclick=()=>grade(1);$('no').onclick=()=>grade(0);
$('only').onclick=()=>{onlyMissed=!onlyMissed;idx=0;render();};
$('rst').onclick=()=>{S[cur]={order:shuf(DATA[cur].items.length),res:{}};onlyMissed=false;idx=0;render();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);});
render();
</script>
