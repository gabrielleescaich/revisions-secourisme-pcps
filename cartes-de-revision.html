<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: onglets par catégorie, une carte à retourner à la fois, navigation dessous */
:root{--edge:#000;--bg:#f4f6fa;--card:#fff;--fg:#1b2433;--mut:#5b6678;--line:#d5dbe6;--acc:#1f5fbf;--accfg:#fff;--ok:#1d7a46;--okbg:#e3f4ea;--ko:#b3261e;--kobg:#fbe7e5;--back:#e9f0fb;--font:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;--back:#1c2a42;--edge:#e8edf6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;--back:#1c2a42;--edge:#e8edf6;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance}
.intro{color:var(--mut);margin:4px 0 0}
#tabs.tabs{display:flex;margin-bottom:10px;border:2px solid var(--fg);border-radius:12px;overflow:hidden;background:var(--card)}
.tabs .tab{flex:1;min-width:0;border:0;border-radius:0;padding:12px 8px;font:inherit;font-size:1rem;font-weight:700;background:transparent;color:var(--fg);line-height:1.2;min-height:48px;cursor:pointer;text-align:center}
.tabs .tab+.tab{border-left:2px solid var(--fg)}
.tabs .tab:hover{background:var(--back)}
.tabs .tab[aria-selected="true"]{background:var(--fg);color:var(--bg);box-shadow:inset 0 -4px 0 var(--acc)}
.tabs .n{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--line);color:var(--fg)}
.tabs .tab[aria-selected="true"] .n{background:var(--acc);color:var(--accfg)}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer;min-height:44px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.tab:focus-visible,.flip:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.src{margin:18px 0 8px;text-align:left;font-size:.8rem;color:var(--mut);line-height:1.4}.src a{color:var(--mut);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}.src a:hover{text-decoration-thickness:3px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font-size:.9rem;min-height:38px;padding:6px 12px;background:transparent}
.cnt{font-weight:600;font-variant-numeric:tabular-nums}
.stat{color:var(--mut);font-size:.9rem;font-variant-numeric:tabular-nums}
.stage{perspective:1200px}
.flip{display:grid;width:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .5s;border-radius:16px}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--edge);border-radius:16px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;gap:12px;background:var(--card);min-width:0}
.face.back{transform:rotateY(180deg);background:var(--back)}
.tag{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.q{font-size:1.3rem;line-height:1.3;font-weight:600;margin:auto 0;text-wrap:balance}
.tap{color:var(--mut);font-size:.85rem;margin-top:auto}
.bq{font-size:.95rem;color:var(--mut);margin:0}
ul.ans{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
ul.ans li{padding-left:2px}
.grade{display:flex;gap:8px}
.grade button{flex:1}
.grade .ok{background:#7fd6a0;border-color:#1d7a46;color:#000;font-weight:700}
.grade .ko{background:#f2928b;border-color:#b3261e;color:#000;font-weight:700}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
.nav button{flex:none}
#gauge{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 10px;border:2px solid var(--acc);border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.15)}.gr{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:10px;font-size:.85rem;font-weight:600}.gr .tr{height:16px;border-radius:8px;background:var(--line);overflow:hidden}.gr .fl{height:100%;border-radius:8px;transition:width .3s}.gr.y .fl{background:var(--ok)}.gr.n .fl{background:var(--ko)}.gr.y{color:var(--ok)}.gr.n{color:var(--ko)}.gr .v{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body>
<main>
 <header>
  <h1>Cartes de révision</h1>
  <p class="intro">Lisez la question, répondez de tête, puis touchez la carte pour la retourner.</p>
 </header>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div class="bar">
  <div><div class="cnt" id="cnt" aria-live="polite"></div><div class="stat" id="stat"></div></div>
  <div class="btns">
   <button id="only">Revoir les ratées</button>
   <button id="rst">Recommencer</button>
  </div>
 </div>
 <div id="gauge"></div>
 <div class="stage"><button class="flip" id="flip" aria-live="polite"></button></div>
 <div class="grade" id="grade" hidden>
  <button class="ko" id="no">À revoir</button>
  <button class="ok" id="yes">Je savais</button>
 </div>
 <div class="nav">
  <button id="prev">← Précédente</button>
   <button class="p" id="next">Suivante →</button>
 </div>
 <p id="src" class="src"></p>
</main>
<script>
const DATA=[{"cat": "Opérationnel", "items": [{"q": "Signes d'une hypothermie légère", "a": ["Victime consciente", "Ventilation et FC rapides", "Frissons permanents", "Peau froide"]}, {"q": "Signes d'une hypothermie modérée", "a": ["Délire, hallucinations, troubles de la conscience d'aggravation progressive", "Ventilation et FC ralenties", "Frissons disparus, rigidité musculaire modérée"]}, {"q": "Signes d'une hypothermie sévère", "a": ["Victime inconsciente", "Pouls difficile à percevoir", "Ventilation et FC lentes", "Rigidité musculaire importante, victime très sensible à toutes mobilisations : peuvent déclencher troubles du rythme ou arrêt cardiaque"]}, {"q": "Signes d'une hypothermie grave", "a": ["Arrêt cardiaque apparent"]}, {"q": "Définition de la gelure", "a": ["Lésions de la peau et des tissus sous-jacents provoquées par un refroidissement local intense suite à une exposition prolongée au froid"]}, {"q": "Aspect des gelures de 1er degré", "a": ["Zone atteinte insensible, rouge, peu oedémateuse, mais sans cloques (phlyctènes)", "Après réchauffement : zone se recolore et victime récupère la perte de sensibilité"]}, {"q": "Aspect des gelures de 2e degré", "a": ["Zone atteinte localisée, insensible, rouge, oedémateuse, avec cloques remplies d’un liquide clair.", "Après réchauffement : perte de sensibilité persiste et dernières phalanges des doigts ou des orteils restent bleues ou violacées"]}, {"q": "Aspect des gelures de 3e degré", "a": ["Zone atteinte insensible, aspect bleuté ou noirâtre, remonte le plus souvent au-dessus des dernières phalanges sans atteindre la totalité de la main ou du pied.", "Après réchauffement : persistance d'une anesthésie et apparition de cloques sanglantes (phlyctènes hématiques).", "Irréversibilité des lésions => amputation de la zone la plus atteinte le plus souvent."]}, {"q": "Aspect des gelures de 4e degré", "a": ["Zone atteinte extensive, totalement insensible, bleutée et englobe la main ou l’avant-pied sans oedème.", "Après réchauffement : pas de cloques, tissus restent froids et insensibles et certains deviennent nécrotiques.", "Amputation nécessaire."]}, {"q": "Définition d'une brulûre grave (plutôt que simple)", "a": ["Une ou plusieurs cloques dont la surface totale est supérieure à celle de la moitié de la paume", "Destruction plus profonde (aspect blanchâtre ou noirâtre parfois indolore) associée souvent à des cloques et à une rougeur plus ou moins étendue", "Aspect circulaire (qui fait le tour du cou ou d’un membre)", "Localisation (visage ou cou, mains, articulations, voisinage des orifices naturels)", "Rougeur étendue (coup de soleil généralisé par exemple) de la peau chez l’enfant", "Origine chimique, électrique ou radiologique"]}, {"q": "Définition d'une plaie", "a": ["Lésion de la peau avec effraction et atteinte possible des tissus sous-jacents."]}, {"q": "Définition d'une plaie grave (plutôt que simple)", "a": ["Hémorragie associée", "Mécanisme pénétrant (objet tranchant ou perforant, morsures, projectiles)", "Localisation (cou, thorax, abdomen, oeil, orifices naturels)", "Aspect (déchiquetée, écrasée)", "Plaies multiples"]}, {"q": "Indication d'un pansement stérile", "a": ["Protéger une ou plusieurs plaies étendues", "Protéger les brûlures graves"]}, {"q": "Signes de traumatisme à l'abdomen", "a": ["Douleur spontanée siégeant au niveau d’une partie ou de tout l’abdomen", "Douleur à la palpation prudente des côtes", "Douleur provoquée lors d’une palpation prudente de l’abdomen qui peut être anormalement dur", "Absence de soulèvement de l’abdomen à chaque inspiration", "Contusion ou une plaie plus ou moins importante", "Vomissements de sang rouge (hématémèse)"]}, {"q": "Signes de traumatisme du thorax", "a": ["Douleur spontanée siégeant au niveau d’une ou plusieurs côtes ou provoquée par les mouvements respiratoires ou la toux", "Emission de crachats de sang rouge", "Douleur à la palpation prudente des côtes", "Plaie avec ou sans bulles sanglantes à l’expiration", "Contusion", "Anomalie du soulèvement de la poitrine", "Déformation nette du thorax", "Toux incessante ou des crachats de sang rouge", "Lésions associées (polytraumatisme)"]}, {"q": "Signes de traumatisme de la face et de la face antérieure du cou", "a": ["Douleur de la face, trouble de la vision ou difficulté à avaler", "Détresse respiratoire par obstruction des voies aériennes", "Détresse circulatoire secondaire à une hémorragie externe ou extériorisée", "Oedème de la face ou localisé (oedème des paupières)", "Hématome de la face, un hématome en lunette", "Une ou plusieurs plaies de la face, de la langue ou du cou", "Déformation de la face traduisant une fracture des os de la face, du nez ou de la mandibule", "Saignement du nez ou de la bouche", "Atteinte de l’oeil objectivée par une anomalie des mouvements de l’oeil, la présence de sang sous la cornée, une déformation de la pupille, une plaie de l’oeil avec ou sans corps étranger intraoculaire visible", "Désinsertion ou une fracture de dents"]}, {"q": "Signes de traumatisme des membres", "a": ["Perception d’un craquement au moment de la chute ou du choc", "Douleur vive à l’endroit de la blessure ou à côté, augmentée par le mouvement ou la palpation", "Difficulté voire de impossibilité à bouger le membre atteint ou à se déplacer", "Déformation et gonflement visibles au niveau de la lésion"]}, {"q": "Indication d'une compression manuelle", "a": ["Devant toute hémorragie externe accessible, quelle que soit sa localisation, et si elle ne présente pas de corps étranger."]}, {"q": "Définition de l'arrêt cardiaque", "a": ["Une personne est en arrêt cardiaque lorsque son cœur ne fonctionne plus ou fonctionne d’une façon anarchique, ne permettant plus d’assurer l’oxygénation du cerveau."]}, {"q": "Qu'est-ce qu'une ventilation agonique ?", "a": ["Mouvements ventilatoires inefficaces, bruyants, anarchiques et lents (≤ 1 mvt en 10 sec soit 6 mvts/min)"]}, {"q": "A quelle niveau se fait la recherche de pouls en cas d'arrêt cardiaque (adulte, enfant, nourrisson) ?", "a": ["Adulte et enfant : carotidien", "Nourrisson : fémoral"]}, {"q": "Symptômes du Trouble de stress aigu", "a": ["Répétition de l’événement initial au travers de souvenirs envahissants (flashbacks), ou de cauchemars", "Evitement de toutes les situations, personnes, endroits … susceptibles de rappeler des souvenirs, pensées ou sentiments étroitement associés à l’événement critique", "Conduites d’hypervigilance comme si l’événement allait se reproduire de façon imminente, et ce malgré l’absence de danger", "Façon de penser plus négative, difficulté à éprouver des sentiments positifs"]}, {"q": "Indication du plan dur", "a": ["Essentiellement utilisé pour permettre une extraction d’une victime située dans un endroit difficile d'accès (endroit exigu, véhicule accidenté…).", "Avec immobilisateur de tête : utilisé en l’absence de matelas immobilisateur à dépression, pour immobiliser une victime suspecte d’un traumatisme du rachis.", "Pour allonger une victime suspecte d'un traumatisme du rachis et qui est retrouvée debout."]}, {"q": "Signes de traumatisme du crâne", "a": ["Au début du bilan :", "Perte de connaissance qui persiste depuis l’accident", "Troubles de la conscience (somnolence, confusion, agitation anormale)", "Convulsions", "Asymétrie pupillaire nette et fixe", "Lors de la poursuite du bilan :", "Céphalées ou d’une douleur spontanée au niveau des os du crâne", "Nausées ou de vomissements", "Perte de la mémoire des faits souvent synonyme d’une perte de connaissance passagère immédiatement après l’accident, parfois relatée par les témoins", "Déficit moteur neurologique", "Plaie du cuir chevelu, un hématome ou une déformation", "Hématome « en lunettes » (autour des yeux) pouvant témoigner d’une fracture des os de la base du crâne", "Otorragie ou une épistaxis. En cas d’otorragie, la compression manuelle est inutile. Vérifier que l’écoulement sanguin vient bien de l’intérieur de l’oreille en la nettoyant avec une compresse", "Lésions associées en particulier de la colonne cervicale"]}, {"q": "Signes de traumatisme du bassin", "a": ["Douleur spontanée siégeant au niveau du bassin ou dans la partie basse de l’abdomen. Elle est un signe évocateur d’un traumatisme du bassin", "Douleur localisée au niveau du bassin", "Impossibilité de bouger les membres inférieurs en raison de la douleur", "Présence de sang dans les urines ou sur les sousvêtements (liée à l’atteinte de la vessie ou de l’urètre)", "Hématome important au niveau du pubis", "Lésion des organes urogénitaux externes, particulièrement chez l’homme (lésions associées peuvent masquer le traumatisme du bassin)"]}, {"q": "Indications de massage utérin", "a": ["Pour prévenir ou réduire les hémorragies extériorisées immédiate postpartum."]}, {"q": "Indications de refroidissement de la victime", "a": ["Nécessaire chez une victime qui présente une hyperthermie, par exemple lors d’affections liés à la chaleur."]}, {"q": "Définition de l'intoxication", "a": ["Trouble engendré par la pénétration dans l’organisme d’une substance appelée poison ou toxique."]}, {"q": "Par quels processus le poison peut-il pénétrer dans l'organisme ?", "a": ["Ingestion : Il est avalé et absorbé par le tube digestif (aliments contaminés, médicaments, produits domestiques)", "Inhalation : Il pénètre par les voies respiratoires et est absorbé dans l’organisme par les poumons (gaz toxiques, aérosols)", "Injection : Il pénètre dans l’organisme à l’occasion d’une plaie (venins, piqûres)", "Absorption : Il pénètre dans l’organisme à travers la peau saine (produits industriels : désherbants, pesticides)"]}, {"q": "Définition du traumatisme/syndrome de suspension", "a": ["Toutes les manifestations qui surviennent chez une victime qui est suspendue, immobile, en position verticale pendant une durée prolongée (plus de 5 minutes)."]}, {"q": "Indication d'aide à la marche", "a": ["Pour aider un blessé léger, qui peut maintenir la station debout, à marcher sur quelques mètres."]}, {"q": "Indication de déplacement d’une victime à l’aide d’une chaise de transport", "a": ["• la victime ne présente pas de détresse ou d'atteinte grave", "• la victime peut supporter la position assise"]}, {"q": "Indication de relevage à quatre secouristes", "a": ["• si la corpulence de la victime le nécessite", "• si un brancard cuillère ne peut être utilisé pour relever une victime suspecte d’un traumatisme de la colonne vertébrale"]}, {"q": "Indication de LVA par bascule prudente de la tête en arrière et élévation du menton", "a": ["Chez toute victime ayant perdu connaissance, non suspecte d’un traumatisme du rachis, avant d’apprécier sa respiration"]}, {"q": "Indication de LVA par simple élévation du menton", "a": ["Chez toute victime ayant perdu connaissance, suspecte d’un traumatisme du rachis"]}, {"q": "Indication de mesure de la température", "a": ["Réalisée systématiquement chez toute victime suspecte d’hypothermie ou d’hyperthermie (victime anormalement chaude ou froide au touché lors de son examen)"]}, {"q": "Indication d'inhalation d'oxygène", "a": ["Nécessaire chez toute victime qui présente :", "• une détresse respiratoire ou circulatoire", "• une intoxication aux fumées d’incendie ou au monoxyde de carbone", "• un accident lié à la plongée", "• une mesure de la SpO2 qui indique une valeur < 94 %", "• une mesure de la SpO2 qui indique une valeur < 89 % chez l’insuffisant respiratoire chronique avec ou sans oxygène à domicile", "• une crise douloureuse chez une victime qui présente des antécédents de drépanocytose", "Si les circonstances ne permettent pas de prendre la mesure de la SpO2 (extrémités froides, panne de l’appareil, etc.), l’inhalation d’oxygène est systématique si la victime présente une détresse vitale, dans l’attente d’un avis médical."]}, {"q": "Définition de l'hémorragie externe", "a": ["Perte de sang qui provient d'une plaie ou d'un orifice naturel et qui ne s'arrête pas spontanément. Elle imbibe de sang un mouchoir de tissu ou de papier en quelques secondes."]}, {"q": "Définition de l'hémorragie extériorisée", "a": ["Epanchement de sang à l’intérieur de l’organisme qui s’extériorise par un orifice naturel (oreille, nez, bouche, voies urinaires, anus, vagin)"]}, {"q": "Définition de la compression d'un membre", "a": ["Interruption de la circulation sanguine au niveau de masses musculaires comprimées"]}, {"q": "Au bout de combien de temps parle-t-on d'une compression de membre \"prolongée\" ?", "a": ["Plus de deux heures"]}, {"q": "Qu'est-ce que le « crush syndrome » ou « syndrome des ensevelis » ?", "a": ["Compression prolongée (plus de deux heures) des muscles des membres"]}, {"q": "Indication de compression manuelle", "a": ["Devant toute hémorragie externe accessible, quelle que soit sa localisation, et si elle ne présente pas de corps étranger."]}, {"q": "Justification de la compression manuelle", "a": ["La plupart des hémorragies externes s’arrêtent en appuyant sur la plaie. La compression manuelle est une technique facile et rapide. Elle est très efficace et suffit dans la plupart des cas pour arrêter le saignement."]}, {"q": "Indication de pansement compressif", "a": ["Pour relayer une compression manuelle efficace, lorsque la localisation le permet"]}, {"q": "Indication du garrot", "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace, impossible ou lors de situations particulières.", "Il ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Indication de la gaze imbibée de substance hémostatique", "a": ["Adaptée pour des hémorragies externes siégeant à la racine d’un membre (creux axillaire, pli de l’aine), au niveau des fesses, du cou et de la tête, et ne permettant pas la mise en place d’un garrot lorsque la compression manuelle continue est inefficace ou impossible."]}, {"q": "Définition de l'OVA", "a": ["Gêne ou empêchement brutal des mouvements de l’air entre l’extérieur et les poumons, par un corps étranger."]}, {"q": "Indication de compressions thoraciques", "a": ["Nécessaire en cas de :", "Arrêt cardiaque", "Perte de connaissance à la suite d’une obstruction des voies aériennes", "Nouveau-né qui présente une détresse à la naissance"]}, {"q": "Indication de ventilation artificielle", "a": ["Nécessaire, après libération des voies aériennes, en présence d’une victime :", "• en arrêt respiratoire", "• présentant une respiration agonique et dont la fréquence respiratoire est inférieure ou égale à six mouvements par minute"]}, {"q": "Définition de la perte de connaissance", "a": ["Perte permanente ou temporaire de l’aptitude à communiquer et à réagir avec d’autres personnes et avec l’environnement"]}, {"q": "Indication de PLS à deux secouristes ", "a": ["Après avis médical chez toute victime qui a perdu connaissance, respire normalement et est suspecte de traumatisme"]}, {"q": "Indication de PLS à un secouriste", "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Indication d'administration d'un médicament", "a": ["Si elle le demande, car il lui a été prescrit, ou à la demande du médecin régulateur."]}, {"q": "Définition de la douleur thoracique", "a": ["Signe perçu par une victime qui apparaît de manière aiguë, au repos, ou au cours d’un effort, et siégeant au niveau du thorax."]}, {"q": "Définition de l'AVC (ou attaque cérébrale)", "a": ["Déficit neurologique soudain d’origine vasculaire (la circulation sanguine d’une partie du cerveau est interrompue)"]}, {"q": "Définition de la crise convulsive généralisée", "a": ["Perturbation de l’activité électrique cérébrale qui se traduit extérieurement par une perte de connaissance et/ou un regard fixe accompagné de mouvements musculaires incontrôlés de tout le corps (convulsion généralisée)."]}, {"q": "Définition de la crise d'asthme", "a": ["Détresse respiratoire provoquée par une inflammation et une contraction des fibres musculaires lisses des bronchioles (petites bronches) qui entraîne un rétrécissement brutal de leur calibre."]}, {"q": "Définitions des piqûres et morsures", "a": ["Piqûres : atteintes provoquées par certains insectes ou par certains animaux marins", "Morsures : plaies provoquées par des dents ou des crochets et concerne donc l’Homme, les animaux domestiques ou sauvages et les serpents"]}, {"q": "Définitions de la pendaison et de la strangulation", "a": ["Pendaison : suspension du corps par le cou", "Strangulation : constriction du cou ou pression sur la gorge"]}, {"q": "Définition des lésions de blast", "a": ["Lésions anatomiques générées à la suite d’une forte explosion"]}, {"q": "Donner les quatre types de lésions de blast", "a": ["Blast primaire (lésions provoquées par l’onde de choc. Elles peuvent se produire à l’air libre, dans l’eau ou au contact de surfaces solides)", "Blast secondaire (lésions induites par la projection de matériaux sur la victime, en raison du déplacement d’air généré par l’explosion (souffle))", "Blast tertiaire (lésions provoquées par la projection de la victime elle-même si le souffle est très puissant)", "Blast quaternaire (lésions induites par l’explosion elle-même, par brûlure externe ou des voies aériennes, par intoxication due aux fumées ou aux produits chimiques)"]}, {"q": "Définition de la foudre", "a": ["Décharge électrique entre le nuage et la terre"]}, {"q": "Définition du relevage", "a": ["Action qui consiste à placer une victime sur un brancard, directement ou à l'aide d'un dispositif particulier de relevage afin d’assurer son déplacement (brancardage)"]}]}, {"cat": "Actions solidaires et sociales", "items": [{"q": "Lieux interdits lors des maraudes locales", "a": ["lieux privés", "bois", "parcs et jardins", "métros et gares", "parkings", "souterrains", "périphérique", "quais de Seine"]}, {"q": "Lieux interdits lors des maraudes locales spécifiques à Paris 10", "a": ["gare du Nord", "gare de l'Est", "place de la République"]}, {"q": "Matériel indispensable en maraude locale", "a": ["radio portative", "DSA", "Lot V si maraude en VL", "GHV si maraude en VL ou vélo"]}, {"q": "Matériel facultatif en maraude locale", "a": ["Denrées alimentaires", "Bouteilles d'eau", "Thermos d'eau chaude", "\"Guide solidarité\" édité par la Mairie de Paris", "Produits d'hygiène", "Vêtements", "Duvets"]}]}, {"cat": "PSC", "items": [{"q": "Définition d'une brulûre grave (plutôt que simple)", "a": ["Une ou plusieurs cloques dont la surface totale est supérieure à celle de la moitié de la paume de la main de la victime", "Destruction plus profonde (aspect blanchâtre ou noirâtre parfois indolore) associée souvent à des cloques et à une rougeur plus ou moins étendue", "Aspect circulaire (qui fait le tour du cou ou d’un membre)", "Localisation (visage ou le cou, les mains, les articulations ou au voisinage des orifices naturels)", "Rougeur étendue (un coup de soleil généralisé par exemple) de la peau chez l’enfant", "Brûlure d’origine chimique, électrique ou radiologique"]}, {"q": "Définition d'une plaie", "a": ["Lésion de la peau, revêtement protecteur du corps, avec une atteinte possible des tissus situés dessous."]}, {"q": "Définition/signes d'une plaie grave (plutôt que simple)", "a": ["Hémorragie associée ;", "Mécanisme pénétrant (objet tranchant ou perforant, morsures, projectiles, injection de liquide sous pression)", "Localisation (thoracique, abdominale, oculaire ou proche d’un orifice naturel)", "Aspect (déchiqueté, écrasé)", "Multiplicité des plaies"]}, {"q": "Définition des traumatismes/atteintes traumatiques", "a": ["Lésions des os (fractures), des articulations (entorses ou luxations), des organes ou de la peau."]}, {"q": "Indication d'une compression", "a": ["Sur toute plaie qui saigne abondamment"]}, {"q": "Indication de pose d'un garrot", "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace ou impossible.", "Ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Définition de l'arrêt cardiaque", "a": ["Une personne est en arrêt cardiaque lorsque son coeur ne fonctionne plus ou fonctionne d’une façon anarchique, ne permettant plus d’assurer l’oxygénation du cerveau."]}, {"q": "Quelle est la principale maladie du cœur causant des arrêts cardiaques chez l'adulte ?", "a": ["Infarctus de myocarde"]}, {"q": "Indication de libération des voies aériennes", "a": ["Réalisée systématiquement avant de pouvoir rechercher la respiration chez une victime qui ne répond ou ne réagit à aucune sollicitation verbale ou physique."]}, {"q": "Indication de PLS", "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Définition de l'hémorragie", "a": ["Perte de sang qui provient d'une plaie ou d'un orifice naturel et qui ne s'arrête pas spontanément. Elle imbibe de sang un mouchoir de tissu ou de papier en quelques secondes."]}, {"q": "Risques liés à une hémorragie", "a": ["Pour la victime : détresse circulatoire ou un arrêt cardiaque par une diminution importante de la quantité de sang dans l'organisme", "Pour le secouriste : être infecté par une maladie transmissible s'il présente des effractions cutanées (plaies, piqûres) ou en cas de projection sur les muqueuses (bouche, yeux)"]}, {"q": "Indication de compression", "a": ["Sur toute plaie qui saigne abondamment"]}, {"q": "Justification de la compression", "a": ["La compression des vaisseaux sanguins, au niveau d’une plaie, arrête le saignement."]}, {"q": "Indication du garrot", "a": ["En cas d’hémorragie d’un membre lorsque la compression directe est inefficace ou impossible.", "Il ne peut être posé qu’aux membres supérieurs ou inférieurs."]}, {"q": "Justification du garrot", "a": ["But : arrêter une hémorragie externe en interrompant totalement la circulation du sang du membre, en aval de l’endroit où il est posé"]}, {"q": "Définition de l'OVA", "a": ["Gêne ou empêchement brutal des mouvements de l’air entre l’extérieur et les poumons, par un corps étranger."]}, {"q": "Justification de la désobstruction par des claques dans le dos", "a": ["But : provoquer un mouvement de toux pour débloquer et expulser le corps étranger qui obstrue les voies aériennes"]}, {"q": "Justification de la désobstruction par des compressions abdominales", "a": ["But : comprimer l’air contenu dans les poumons de la victime afin d’expulser le corps étranger par un effet de « piston »"]}, {"q": "Indication de compressions thoraciques", "a": ["Nécessaires chaque fois qu’une victime :", "Présente un arrêt cardiaque", "A perdu connaissance à la suite d’une obstruction des voies aériennes."]}, {"q": "Indication de défibrillation", "a": ["Victime en arrêt cardiaque"]}, {"q": "Définition de la perte de connaissance", "a": ["Une personne a perdu connaissance lorsqu'elle ne répond et ne réagit à aucune sollicitation verbale ou physique, mais respire."]}, {"q": "Indication de PLS", "a": ["Chez toute victime qui ne répond pas, ne réagit pas, mais respire (perte de connaissance) à la suite d’un évènement non traumatique ou à la demande du service de secours alerté."]}, {"q": "Définition du malaise", "a": ["Sensation pénible traduisant un trouble du fonctionnement de l’organisme, sans pouvoir en identifier obligatoirement l’origine."]}, {"q": "Indication de manœuvres physiques", "a": ["Dès que la victime reconnait des signes annonciateurs d’une perte de connaissance imminente."]}, {"q": "Indication de la désobstruction par des compressions thoraciques", "a": ["En cas d’obstruction totale des voies aériennes par un corps étranger :", "• lorsqu’il est impossible d’encercler l’abdomen de la victime (personne obèse ; femme enceinte ; personne alitée ou allongée, difficilement mobilisable)", "• chez une victime qui peut tenir sur l’avant-bras du secouriste"]}]}];
const $=id=>document.getElementById(id);
let cur=0,idx=0,onlyMissed=false;
const shuf=n=>{const o=Array.from({length:n},(_,i)=>i);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}return o;};
const S=DATA.map(t=>({order:shuf(t.items.length),res:{}}));
const deck=()=>{const s=S[cur];return onlyMissed?s.order.filter(i=>s.res[i]===0):s.order;};
function tabs(){
 $('tabs').innerHTML='';
 DATA.forEach((t,i)=>{const b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.setAttribute('aria-selected',i===cur);
  b.innerHTML='';b.append(t.cat+' ');const nn=document.createElement('span');nn.className='n';nn.textContent=t.items.length;b.appendChild(nn);b.onclick=()=>{cur=i;idx=0;onlyMissed=false;render();};$('tabs').appendChild(b);});
}
function gauge(){
 const s=S[cur],n=DATA[cur].items.length;let y=0,k=0;
 for(let i=0;i<n;i++){const v=s.res[i];if(v===1)y++;else if(v===0)k++}
 const row=(c,l,v)=>'<div class="gr '+c+'"><span>'+l+'</span><div class="tr"><div class="fl" style="width:'+(100*v/n)+'%"></div></div><span class="v">'+v+' / '+n+'</span></div>';
 const g=$('gauge');g.innerHTML=row('y','Réussi',y)+row('n','Raté',k);
 g.setAttribute('aria-label',y+' sues et '+k+' à revoir sur '+n+' cartes');
}
function render(){
 tabs();const d=deck(),s=S[cur];gauge();
 {const SRC={'Opérationnel':'Source : <a href="https://drloser123.github.io/referentiel-pse/" target="_blank" rel="noopener">Références techniques nationales PSE&nbsp;↗</a>','PSC':'Source : Références techniques nationales PSC','Actions solidaires et sociales':'Source : FR DA-01-10'};$('src').innerHTML=SRC[DATA[cur].cat]||'';}
 $('only').textContent=onlyMissed?'Toutes les cartes':'Revoir les ratées';
 $('only').disabled=!onlyMissed&&!Object.values(s.res).includes(0);
 const f=$('flip');f.classList.remove('on');$('grade').hidden=true;
 if(!d.length){f.innerHTML='<div class="face"><p class="q">Aucune carte à revoir.</p></div>';$('cnt').textContent='0 / 0';$('stat').textContent='';$('prev').disabled=$('next').disabled=true;return;}
 if(idx>=d.length)idx=d.length-1;
 gauge();
 const it=DATA[cur].items[d[idx]];
 f.innerHTML='';
 const fr=document.createElement('div');fr.className='face front';
 fr.innerHTML='<span class="tag">Question</span><p class="q"></p><span class="tap">Touchez pour retourner</span>';fr.querySelector('.q').textContent=it.q;
 const bk=document.createElement('div');bk.className='face back';
 bk.innerHTML='<span class="tag">Réponse</span><p class="bq"></p><ul class="ans"></ul>';bk.querySelector('.bq').textContent=it.q;
 const ul=bk.querySelector('ul');it.a.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.appendChild(li);});
 f.append(fr,bk);bk.setAttribute('aria-hidden','true');
 $('cnt').textContent='Carte '+(idx+1)+' / '+d.length;
 const r=Object.values(s.res);$('stat').textContent=r.filter(v=>v===1).length+' sues · '+r.filter(v=>v===0).length+' à revoir';
 $('prev').disabled=idx===0;$('next').disabled=idx===d.length-1;
}
function flip(){const f=$('flip');if(!f.querySelector('.face'))return;const on=f.classList.toggle('on');$('grade').hidden=!on;
 f.querySelector('.front').setAttribute('aria-hidden',on);f.querySelector('.back').setAttribute('aria-hidden',!on);}
function go(n){const d=deck();idx=Math.max(0,Math.min(d.length-1,idx+n));render();}
function grade(v){const d=deck();if(!d.length)return;S[cur].res[d[idx]]=v;if(idx<d.length-1&&!onlyMissed){idx++;}else if(onlyMissed&&v===1){}else if(idx<d.length-1)idx++;render();}
$('flip').onclick=flip;
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('yes').onclick=()=>grade(1);$('no').onclick=()=>grade(0);
$('only').onclick=()=>{onlyMissed=!onlyMissed;idx=0;render();};
$('rst').onclick=()=>{S[cur]={order:shuf(DATA[cur].items.length),res:{}};onlyMissed=false;idx=0;render();};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);});
render();
</script>
