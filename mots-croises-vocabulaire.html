<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mots croisés – Vocabulaire médical</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--surf:#fff;--ink:#1d2433;--mut:#667085;--line:#c9cdd6;--blk:#1d2433;--acc:#c8322b;--accs:#fbe3e1;--wd:#fff1c9;--ok:#1f7a4d;--bad:#b42318;--badbg:#fde4e1;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--blk:#0b0d12;--acc:#ff6b61;--accs:#4a2522;--wd:#3d3519;--ok:#5ad19a;--bad:#ff8a80;--badbg:#4a2522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--blk:#0b0d12;--acc:#ff6b61;--accs:#4a2522;--wd:#3d3519;--ok:#5ad19a;--bad:#ff8a80;--badbg:#4a2522;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
#cur{background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin-bottom:12px;min-height:3.2em}
#cur b{color:var(--acc)}
.gw{overflow-x:auto;padding-bottom:6px}
#grid{display:grid;width:max-content;gap:1px;background:var(--line);border:1px solid var(--line);margin:0 auto}
.c{width:var(--cs);height:var(--cs);position:relative;background:var(--surf);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-weight:600;font-size:calc(var(--cs)*.5)}
.k{background:var(--blk);cursor:default}
.c .n{position:absolute;top:1px;left:2px;font-size:calc(var(--cs)*.28);font-weight:500;color:var(--mut);line-height:1}
.c.w{background:var(--wd)}
.c.cur{background:var(--accs);outline:2px solid var(--acc);outline-offset:-2px;z-index:1}
.c.bad{background:var(--badbg);color:var(--bad)}
.c.ok{color:var(--ok)}
.cl h2{font-size:1rem;margin:0 0 6px;color:var(--acc)}
.cl ol{list-style:none;margin:0 0 16px;padding:0;max-height:42vh;overflow:auto}
.cl li{display:flex;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:.92rem}
.cl li:hover{background:var(--accs)}
.cl li.on{background:var(--wd);outline:1px solid var(--acc)}
.cl li b{min-width:1.6em;text-align:right;color:var(--mut)}
#msg{margin:10px 0;font-weight:600;color:var(--ok);min-height:1.4em}
#kb{position:fixed;opacity:0;pointer-events:none;left:-100px;top:0;width:1px;height:1px}
</style>
</head>
<body>
<main>
<h1>Mots croisés : vocabulaire médical</h1>
<p class="sub">Trouve le terme correspondant à chaque définition. Accents et tirets ne comptent pas (Latéro-thoracique s’écrit LATEROTHORACIQUE).</p>
<div class="bar">
<label>Taille <select id="size"><option value="8">Courte (8 mots)</option><option value="12">Moyenne (12 mots)</option><option value="18" selected>Complète (18 mots)</option></select></label>
<button class="p" id="new">Nouvelle grille</button>
<button id="chk">Vérifier</button>
<button id="hint">Révéler la lettre</button>
<button id="rev">Tout révéler</button>
<button id="clr">Effacer</button>
</div>
<div class="layout">
<section>
<div id="cur"></div>
<div class="gw"><div id="grid" role="grid" aria-label="Grille de mots croisés"></div></div>
<div id="msg" aria-live="polite"></div>
</section>
<aside class="cl">
<h2>Horizontalement</h2><ol id="lh"></ol>
<h2>Verticalement</h2><ol id="lv"></ol>
</aside>
</div>
<input id="kb" autocomplete="off" autocapitalize="characters" aria-hidden="true" tabindex="-1">
</main>
<script>
const WORDS=[{"a": "VASODILATATION", "q": "Augmentation de la taille des vaisseaux sanguins (veines et artères)"}, {"a": "ICTERE", "q": "Coloration jaune de la peau et des muqueuses"}, {"a": "MYOSIS", "q": "Contraction de la pupille"}, {"a": "LATEROTHORACIQUE", "q": "Côté du thorax"}, {"a": "RETROSTERNAL", "q": "Derrière le sternum"}, {"a": "MYDRIASE", "q": "Dilatation de la pupille"}, {"a": "EPISTAXIS", "q": "Ecoulement de sang par le nez"}, {"a": "OTTORAGIE", "q": "Ecoulement de sang par les oreilles"}, {"a": "PRIAPISME", "q": "Erection non controlée et ne cédant pas"}, {"a": "HYPEROXIE", "q": "Augmentation trop importante de la concentration d’oxygène dans le sang"}, {"a": "HYPOXIE", "q": "Manque d’oxygène / baisse trop importante de la quantité d’oxygène dans le sang"}, {"a": "HEMOSTASE", "q": "Mécanismes d’arrêt du saignement du corps humain"}, {"a": "MEDIOTHORACIQUE", "q": "Milieu du thorax"}, {"a": "ANISOCORIE", "q": "Pupilles de taille asymétrique"}, {"a": "ANAPHYLAXIE", "q": "Réaction allergique grave"}, {"a": "PRECORDIAL", "q": "Région du thorax située en avant du coeur"}, {"a": "TRANSFIXIANTE", "q": "Traversant"}, {"a": "ARYTHMIE", "q": "Variation du rythme cardiaque"}];
//GEN-START
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(words,target,ms){
  const N=44,t0=Date.now();let best=null;
  do{
    const g=Array.from({length:N},()=>Array(N).fill(''));
    const at=(r,c)=>(r<0||c<0||r>=N||c>=N)?'':g[r][c];
    const fit=(w,r,c,d)=>{
      const dr=d,dc=1-d,L=w.length;
      if(r<0||c<0||r+dr*L>N||c+dc*L>N)return -1;
      if(at(r-dr,c-dc)||at(r+dr*L,c+dc*L))return -1;
      let x=0;
      for(let i=0;i<L;i++){
        const rr=r+dr*i,cc=c+dc*i,ch=at(rr,cc);
        if(ch){if(ch!==w[i])return -1;x++}
        else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return -1;
      }
      return x;
    };
    const put=(e)=>{for(let i=0;i<e.a.length;i++)g[e.r+e.d*i][e.c+(1-e.d)*i]=e.a[i]};
    const pool=shuffle(words.slice()).map(w=>[w,w.a.length+Math.random()*3]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    const placed=[];
    const first=pool.shift();
    const e0={...first,r:N>>1,c:(N-first.a.length)>>1,d:0};put(e0);placed.push(e0);
    for(let pass=0;pass<3&&placed.length<target;pass++){
      for(let k=0;k<pool.length&&placed.length<target;k++){
        const w=pool[k];let bs=0,cand=[];
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
          const ch=g[r][c];if(!ch)continue;
          for(let i=0;i<w.a.length;i++){
            if(w.a[i]!==ch)continue;
            for(let d=0;d<2;d++){
              const rr=r-d*i,cc=c-(1-d)*i,x=fit(w.a,rr,cc,d);
              if(x<1)continue;
              if(x>bs){bs=x;cand=[]}
              if(x===bs)cand.push([rr,cc,d]);
            }
          }
        }
        if(cand.length){
          const [r,c,d]=cand[Math.floor(Math.random()*cand.length)];
          const e={...w,r,c,d};put(e);placed.push(e);pool.splice(k,1);k--;
        }
      }
    }
    let r0=N,r1=0,c0=N,c1=0;
    for(const e of placed){r0=Math.min(r0,e.r);c0=Math.min(c0,e.c);r1=Math.max(r1,e.r+e.d*(e.a.length-1));c1=Math.max(c1,e.c+(1-e.d)*(e.a.length-1))}
    const area=(r1-r0+1)*(c1-c0+1);
    const sc=placed.length*10000-area;
    if(!best||sc>best.sc)best={sc,placed,r0,c0,R:r1-r0+1,C:c1-c0+1};
  }while(Date.now()-t0<ms);
  return best;
}
//GEN-END
const $=id=>document.getElementById(id);
let cells,entries,sel;
function build(){
  const b=generate(WORDS,+$('size').value,1500);
  cells=Array.from({length:b.R},()=>Array.from({length:b.C},()=>null));
  entries=b.placed.map(e=>({a:e.a,clue:e.q,r:e.r-b.r0,c:e.c-b.c0,d:e.d,len:e.a.length}));
  entries.forEach((e,i)=>{for(let k=0;k<e.len;k++){
    const r=e.r+e.d*k,c=e.c+(1-e.d)*k;
    const x=cells[r][c]||(cells[r][c]={ch:e.a[k],v:'',n:0,e:[-1,-1],bad:false});
    x.e[e.d]=i;
  }});
  let n=0;
  for(let r=0;r<b.R;r++)for(let c=0;c<b.C;c++){
    const x=cells[r][c];if(!x)continue;
    const st=entries.filter(e=>e.r===r&&e.c===c);
    if(st.length){x.n=++n;st.forEach(e=>e.n=n)}
  }
  render();
  const f=entries.filter(e=>e.d===0).sort((p,q)=>p.n-q.n)[0]||entries[0];
  select(f.r,f.c,f.d);
  $('msg').textContent='';
}
function render(){
  const R=cells.length,C=cells[0].length;
  const w=Math.min(innerWidth,1100)-(innerWidth>820?400:32);
  const cs=Math.max(28,Math.min(42,Math.floor(w/C)));
  const g=$('grid');g.style.setProperty('--cs',cs+'px');
  g.style.gridTemplateColumns=`repeat(${C},${cs}px)`;
  g.innerHTML='';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const x=cells[r][c],d=document.createElement('div');
    d.className='c'+(x?'':' k');d.dataset.r=r;d.dataset.c=c;
    if(x){d.setAttribute('role','gridcell');d.innerHTML=(x.n?`<span class="n">${x.n}</span>`:'')+'<span class="l"></span>'}
    g.appendChild(d);
  }
  for(const d of[0,1]){
    const ol=$(d?'lv':'lh');ol.innerHTML='';
    entries.map((e,i)=>[e,i]).filter(([e])=>e.d===d).sort((p,q)=>p[0].n-q[0].n).forEach(([e,i])=>{
      const li=document.createElement('li');li.dataset.i=i;
      li.innerHTML=`<b>${e.n}</b><span>${e.clue}</span>`;
      li.onclick=()=>{select(e.r,e.c,e.d);$('kb').focus()};
      ol.appendChild(li);
    });
  }
}
const el=(r,c)=>$('grid').children[r*cells[0].length+c];
function wordCells(){const e=entries[cells[sel.r][sel.c].e[sel.d]];const o=[];for(let k=0;k<e.len;k++)o.push([e.r+e.d*k,e.c+(1-e.d)*k]);return o}
function select(r,c,d){
  const x=cells[r][c];if(!x)return;
  if(x.e[d]<0)d=1-d;
  sel={r,c,d};paint();
}
function paint(){
  const R=cells.length,C=cells[0].length;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const x=cells[r][c];if(!x)continue;
    const d=el(r,c);d.classList.remove('w','cur');
    d.classList.toggle('bad',x.bad);
    d.querySelector('.l').textContent=x.v;
  }
  wordCells().forEach(([r,c])=>el(r,c).classList.add('w'));
  el(sel.r,sel.c).classList.add('cur');
  const i=cells[sel.r][sel.c].e[sel.d],e=entries[i];
  $('cur').innerHTML=`<b>${e.n} ${e.d?'Verticalement':'Horizontalement'}</b><br>${e.clue}`;
  document.querySelectorAll('.cl li').forEach(li=>li.classList.toggle('on',+li.dataset.i===i));
  const on=document.querySelector('.cl li.on');if(on)on.scrollIntoView({block:'nearest'});
}
function move(step){
  const w=wordCells(),k=w.findIndex(([r,c])=>r===sel.r&&c===sel.c)+step;
  if(k>=0&&k<w.length){sel.r=w[k][0];sel.c=w[k][1]}
}
function nextWord(step){
  const list=entries.map((e,i)=>i).sort((a,b)=>entries[a].d-entries[b].d||entries[a].n-entries[b].n);
  const cur=cells[sel.r][sel.c].e[sel.d];
  const e=entries[list[(list.indexOf(cur)+step+list.length)%list.length]];
  sel={r:e.r,c:e.c,d:e.d};
}
function type(ch){
  const x=cells[sel.r][sel.c];x.v=ch;x.bad=false;move(1);paint();win();
}
function win(){
  const ok=cells.every(row=>row.every(x=>!x||x.v===x.ch));
  $('msg').textContent=ok?'Bravo, la grille est complète !':'';
}
$('grid').addEventListener('click',ev=>{
  const t=ev.target.closest('.c');if(!t||t.classList.contains('k'))return;
  const r=+t.dataset.r,c=+t.dataset.c;
  if(sel.r===r&&sel.c===c&&cells[r][c].e[1-sel.d]>=0)select(r,c,1-sel.d);else select(r,c,sel.d);
  $('kb').focus();
});
$('kb').addEventListener('input',ev=>{
  const v=ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');ev.target.value='';
  for(const ch of v)type(ch);
});
$('kb').addEventListener('keydown',ev=>{
  const k=ev.key;
  if(k==='Backspace'){ev.preventDefault();const x=cells[sel.r][sel.c];if(x.v){x.v='';x.bad=false}else move(-1);paint()}
  else if(k==='Tab'){ev.preventDefault();nextWord(ev.shiftKey?-1:1);paint()}
  else if(k.startsWith('Arrow')){
    ev.preventDefault();
    const dr=k==='ArrowDown'?1:k==='ArrowUp'?-1:0,dc=k==='ArrowRight'?1:k==='ArrowLeft'?-1:0;
    let r=sel.r+dr,c=sel.c+dc;
    while(cells[r]&&r>=0&&c>=0&&c<cells[0].length&&!cells[r][c]){r+=dr;c+=dc}
    if(cells[r]&&cells[r][c])select(r,c,dr?1:0);
  }
});
$('new').onclick=()=>{build();$('kb').focus()};
$('size').onchange=build;
$('chk').onclick=()=>{cells.forEach(row=>row.forEach(x=>{if(x)x.bad=!!x.v&&x.v!==x.ch}));paint()};
$('hint').onclick=()=>{const x=cells[sel.r][sel.c];x.v=x.ch;x.bad=false;move(1);paint();win()};
$('rev').onclick=()=>{cells.forEach(row=>row.forEach(x=>{if(x){x.v=x.ch;x.bad=false}}));paint();win()};
$('clr').onclick=()=>{cells.forEach(row=>row.forEach(x=>{if(x){x.v='';x.bad=false}}));paint();$('msg').textContent=''};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cells){const s={...sel};render();sel=s;paint()}},200)});
build();
</script>
</body>
</html>
