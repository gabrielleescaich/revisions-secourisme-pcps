<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigles à compléter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3fa;--surf:#fff;--ink:#14233b;--mut:#55627a;--line:#c8d3e4;--acc:#0b4f9e;--accs:#e3edfa;--ok:#1f7a4d;--oks:#dff3e8;--bad:#b42318;--bads:#fde4e1;--accfg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--surf:#172236;--ink:#eaf0fa;--mut:#9eabc2;--line:#2b3a55;--acc:#6ea2f5;--accs:#1c2e4d;--ok:#5ad19a;--oks:#173a2b;--bad:#ff8a80;--bads:#4a2522;--accfg:#0b1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--surf:#172236;--ink:#eaf0fa;--mut:#9eabc2;--line:#2b3a55;--acc:#6ea2f5;--accs:#1c2e4d;--ok:#5ad19a;--oks:#173a2b;--bad:#ff8a80;--bads:#4a2522;--accfg:#0b1220;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
#score{margin-left:auto;font-weight:600}
.gauge-row{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;font-size:.85rem;font-weight:600;margin-top:8px}.gauge-row .tr{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.gauge-row .fl{height:100%;border-radius:7px;transition:width .3s}.gauge-row.y{color:var(--ok)}.gauge-row.y .fl{background:var(--ok)}.gauge-row.n{color:var(--bad)}.gauge-row.n .fl{background:var(--bad)}.gauge-row .v{text-align:right;font-variant-numeric:tabular-nums}
.pg{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .s{grid-column:1/-1}}
.s{font-weight:700;font-size:1.1rem}
.s small{display:block;font-weight:500;font-size:.72rem;color:var(--mut)}
.row input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row.ok{background:var(--oks);border-color:var(--ok)}
.row.ko{background:var(--bads);border-color:var(--bad)}
.row.ok input{border-color:var(--ok)}
.row .b{display:flex;gap:6px}
.row .b button{padding:6px 9px;font-size:.85rem}
.fb{grid-column:1/-1;font-size:.9rem;display:none}
.row.ko .fb,.row.ok .fb.sh,.fb.h{display:block}
.fb b{color:var(--ok)}
.fb.h{color:var(--mut)}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.tabs{display:flex;margin-bottom:10px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surf)}
.tabs button{flex:1;border:0;border-radius:0;padding:12px 8px;font-size:1rem;font-weight:700;background:transparent;color:var(--ink);line-height:1.2}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button:hover{border-color:transparent;background:var(--accs)}
.tabs button.on{background:var(--ink);color:var(--bg);box-shadow:inset 0 -4px 0 var(--acc)}
.tabs .n{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--line);color:var(--ink)}
.tabs button.on .n{background:var(--acc);color:var(--accfg)}
.bar button{font-size:.88rem;padding:6px 12px;border-radius:999px}
.done{display:none;margin:12px 0;padding:12px;border-radius:10px;background:var(--oks);border:1px solid var(--ok);font-weight:600}
h1{border-bottom:4px solid #f7931e;padding-bottom:6px}

</style>

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9]+/g,' ').trim();
function variants(a){const v=new Set([norm(a),norm(a.replace(/\(.*?\)/g,''))]);const m=a.match(/\((.*?)\)/);if(m&&m[1]==='di')v.add(norm(a.replace(/[()]/g,''))),v.add(norm(a.replace(/\(di\)/,'')));a.split('/').forEach(x=>v.add(norm(x)));return [...v].filter(Boolean)}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function isOk(it,val){const n=norm(val);if(!n)return false;return it.v.some(x=>n===x||lev(n,x)<=(x.length>=12?2:x.length>=6?1:0))}

let cur=0;const G=()=>GROUPS[cur];
GROUPS.forEach(g=>{g.items.forEach(it=>it.v=variants(it.a));g.order=g.items.map((_,i)=>i);g.rows=[];g.pane=document.createElement('div');$('list').appendChild(g.pane)});
function render(g){
  g.pane.innerHTML='';g.rows=[];

    const it=g.items[i],r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="s">${it.s}${it.t?`<small>${it.t}</small>`:''}</div><input type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Signification…" aria-label="Signification de ${it.s}"><div class="b"><button class="h" title="Indice">Indice</button><button class="r" title="Voir la réponse">Réponse</button></div><div class="fb"></div>`;
    const inp=r.querySelector('input'),fb=r.querySelector('.fb');
    r._st=0;r._it=it;r._inp=inp;
    inp.addEventListener('input',()=>{r._rev=false;r.className='row';r._st=0;fb.className='fb';upd()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(r);let n=g.rows[g.rows.indexOf(r)+1];while(n&&n.style.display==='none')n=g.rows[g.rows.indexOf(n)+1];if(n)n._inp.focus()}});
    inp.addEventListener('blur',()=>{if(inp.value.trim())check(r)});
    r.querySelector('.h').onclick=()=>{fb.className='fb h';fb.textContent='Indice : '+it.a.replace(/\(.*?\)/g,'').trim().split(/\s+/).map(w=>w[0]+'…').join(' ')+' ('+it.a.split(/\s+/).length+' mots)'};
    r.querySelector('.r').onclick=()=>{const was=isOk(it,inp.value);inp.value=it.a;r._rev=!was;check(r,true)};
    g.pane.appendChild(r);g.rows.push(r);
  });
  upd();
}
function check(r,rev){
  const fb=r.querySelector('.fb'),ok=isOk(r._it,r._inp.value)&&!r._rev;
  r._st=ok?1:2;
  r.className='row '+(ok?'ok':'ko');
  fb.className='fb'+(ok||r._rev?' sh':'');
  fb.innerHTML=r._rev?'<b>Réponse :</b> '+r._it.a:ok?(rev?'<b>Réponse :</b> '+r._it.a:'<b>Exact.</b> '+r._it.a):'Pas tout à fait. Essaie encore, ou clique sur « Indice » ou « Réponse ».';
  upd();
}
function upd(){
  const g=G(),n=g.rows.filter(r=>r._st===1).length,tot=g.items.length;
  $('score').textContent=n+' / '+tot;
  const ko=g.rows.filter(r=>r._st===2).length;const row=(c,l,v)=>'<div class="gauge-row '+c+'"><span>'+l+'</span><div class="tr"><div class="fl" style="width:'+(100*v/tot)+'%"></div></div><span class="v">'+v+' / '+tot+'</span></div>';
  $('gauge').innerHTML=row('y','Réussi',n)+row('n','Raté',ko);
  $('done').style.display=n===tot?'block':'none';
  const only=$('only').checked;g.rows.forEach(r=>r.style.display=(only&&r._st===1)?'none':'');
}
function reorder(fn){
  const g=G(),m=new Map(g.rows.map(r=>[g.items.indexOf(r._it),{v:r._inp.value,st:r._st}]));
  fn(g);render(g);
  g.rows.forEach(r=>{const x=m.get(g.items.indexOf(r._it));if(x&&x.v){r._inp.value=x.v;if(x.st)check(r)}});
}

  cur=i;

  document.querySelectorAll('#tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));

}
