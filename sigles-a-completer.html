<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigles du secourisme : à compléter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--surf:#fff;--ink:#1d2433;--mut:#667085;--line:#c9cdd6;--acc:#c8322b;--accs:#fbe3e1;--ok:#1f7a4d;--oks:#dff3e8;--bad:#b42318;--bads:#fde4e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--acc:#ff6b61;--accs:#4a2522;--ok:#5ad19a;--oks:#173a2b;--bad:#ff8a80;--bads:#4a2522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--surf:#1d212c;--ink:#eceef3;--mut:#9aa3b5;--line:#3a4152;--acc:#ff6b61;--accs:#4a2522;--ok:#5ad19a;--oks:#173a2b;--bad:#ff8a80;--bads:#4a2522;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
#score{margin-left:auto;font-weight:600}
.pg{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .s{grid-column:1/-1}}
.s{font-weight:700;font-size:1.1rem}
.s small{display:block;font-weight:500;font-size:.72rem;color:var(--mut)}
.row input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row.ok{background:var(--oks);border-color:var(--ok)}
.row.ko{background:var(--bads);border-color:var(--bad)}
.row.ok input{border-color:var(--ok)}
.row .b{display:flex;gap:6px}
.row .b button{padding:6px 9px;font-size:.85rem}
.fb{grid-column:1/-1;font-size:.9rem;display:none}
.row.ko .fb,.row.ok .fb.sh,.fb.h{display:block}
.fb b{color:var(--ok)}
.fb.h{color:var(--mut)}
.done{display:none;margin:12px 0;padding:12px;border-radius:10px;background:var(--oks);border:1px solid var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Sigles du secourisme : à compléter</h1>
<p class="sub">Écris ce que signifie chaque sigle. Majuscules, accents et petites fautes de frappe sont tolérés.</p>
<div class="top">
<div class="bar">
<button class="p" id="chk">Vérifier tout</button>
<button id="mix">Mélanger</button>
<button id="ord">Ordre alphabétique</button>
<button id="clr">Tout effacer</button>
<label><input type="checkbox" id="only"> Non réussis seulement</label>
<span id="score">0 / 0</span>
</div>
<div class="pg"><i id="bar"></i></div>
</div>
<div class="done" id="done">Bravo, tous les sigles sont trouvés !</div>
<div id="list"></div>
</main>
<script>
const DATA=[{"s": "EPAN", "t": "BSPP", "a": "Echelle pivotante automatique à nacelle"}, {"s": "3S", "t": "", "a": "Sauveteur solidaire et social"}, {"s": "AAG", "t": "", "a": "Asthme aigu grave"}, {"s": "AC", "t": "", "a": "Arrêt cardiaque"}, {"s": "ACR", "t": "", "a": "Arrêt cardio-respiratoire"}, {"s": "ACSA", "t": "", "a": "Attestation complémentaire de secours aquatique"}, {"s": "ACT", "t": "", "a": "Attelle cervico-thoracique"}, {"s": "ADPC", "t": "", "a": "Association départementale de Protection civile"}, {"s": "AEV", "t": "", "a": "Accident d’exposition à un risque viral"}, {"s": "AIT", "t": "", "a": "Accident ischémique transitoire"}, {"s": "APC", "t": "", "a": "Association de Protection civile"}, {"s": "AR", "t": "BSPP", "a": "Ambulance de réanimation"}, {"s": "ARS", "t": "", "a": "Assistant de régulation secouriste"}, {"s": "AVC", "t": "", "a": "Accident vasculaire cérébral"}, {"s": "AVP", "t": "", "a": "Accident de la voie publique"}, {"s": "BEA", "t": "BSPP", "a": "Bras élévateur articulé"}, {"s": "BNSSA", "t": "", "a": "Brevet National de Sécurité et de Sauvetage Aquatique"}, {"s": "BPCO", "t": "", "a": "Bronchopneumopathie chronique obstructive"}, {"s": "BPI", "t": "", "a": "Bateau de 1ere intervention"}, {"s": "BSPP", "t": "", "a": "Brigade de Sapeurs-Pompiers de Paris"}, {"s": "CAI", "t": "", "a": "Centre d’accueil des impliqués"}, {"s": "CE", "t": "", "a": "Chef d’équipe"}, {"s": "CE2S", "t": "", "a": "Chef d’équipe solidaire et social"}, {"s": "CEPS", "t": "", "a": "Chef d’équipe prompt secours"}, {"s": "CO", "t": "", "a": "Monoxyde de carbone"}, {"s": "CO2", "t": "", "a": "Dioxyde de carbone"}, {"s": "COP", "t": "", "a": "Cadre opérationnel de permanence"}, {"s": "CP", "t": "", "a": "Chef de poste"}, {"s": "CS", "t": "BSPP", "a": "Centre de secours"}, {"s": "CUMP", "t": "", "a": "Cellule d’urgence médico-psychologique"}, {"s": "DAE", "t": "", "a": "Défibrillateur automatisé externe"}, {"s": "DASRI", "t": "", "a": "Déchets d’activités de soins à risques infectieux"}, {"s": "DEA", "t": "", "a": "Défibrillateur entièrement automatisé"}, {"s": "DGSCGC", "t": "", "a": "Direction Générale de la Sécurité Civile et de la Gestion des Crises"}, {"s": "DSA", "t": "", "a": "Défibrillateur semi-automatique"}, {"s": "DSI", "t": "", "a": "Dose supposée ingérée"}, {"s": "ECG", "t": "", "a": "Electrocardiogramme"}, {"s": "FAST", "t": "", "a": "Face, arm, speech, time"}, {"s": "FC", "t": "", "a": "Fréquence cardiaque"}, {"s": "FFP2", "t": "", "a": "Masque de protection respiratoire individuel"}, {"s": "FI", "t": "", "a": "Formation initiale"}, {"s": "FR", "t": "", "a": "Fréquence respiratoire"}, {"s": "GHV", "t": "", "a": "Gilet haute visibilité"}, {"s": "Hg", "t": "", "a": "Mercure"}, {"s": "IAO", "t": "", "a": "Infirmier d’accueil et d’orientation"}, {"s": "IOA", "t": "", "a": "Infirmier d’organisation de l’accueil"}, {"s": "LAA", "t": "", "a": "Lot anti-agression"}, {"s": "LDL", "t": "", "a": "Lipoprotéines de basse densité (dit “mauvais” cholestérol)"}, {"s": "LVA", "t": "", "a": "Libération des voies aériennes"}, {"s": "MCE", "t": "", "a": "Massage cardiaque externe"}, {"s": "MID", "t": "", "a": "Matelas immobilisateur à dépression"}, {"s": "MIN", "t": "", "a": "Mort inattendue et inexpliquée du nourrisson"}, {"s": "O2", "t": "", "a": "(di)Oxygène"}, {"s": "OVA", "t": "", "a": "Obstruction des voies aériennes"}, {"s": "PA", "t": "", "a": "Pression artérielle"}, {"s": "PAE FPS", "t": "", "a": "Pédagogie Appliquée à l’emploi de Formateur de Premiers Secours"}, {"s": "PAE FPSC", "t": "", "a": "Pédagogie Appliquée à l’Emploi de Formateur en Prévention et Secours Civiques"}, {"s": "PAM", "t": "", "a": "Poste associatif médicalisé"}, {"s": "PC", "t": "", "a": "Perte de connaissance"}, {"s": "PICF", "t": "", "a": "Pédagogie Initiale et Commune de Formateur"}, {"s": "PLS", "t": "", "a": "Position latérale de sécurité"}, {"s": "PNI", "t": "", "a": "Pression artérielle non invasive"}, {"s": "PRV", "t": "", "a": "Point de rassemblement des victimes"}, {"s": "PSA", "t": "", "a": "Poste de secours avancé"}, {"s": "RCP", "t": "", "a": "Réanimation cardio-pulmonaire"}, {"s": "RIS", "t": "", "a": "Ratio d’intervenants secouristes"}, {"s": "SAI", "t": "", "a": "Seringue auto-injectable"}, {"s": "SAMU", "t": "", "a": "Service d’Aide Médicale Urgente (niveau départemental)"}, {"s": "SAU", "t": "", "a": "Service d’accueil des urgences"}, {"s": "SMUR", "t": "", "a": "Service mobile d’urgence et de réanimation (niveau centre hospitalier)"}, {"s": "SpO2", "t": "", "a": "Saturation pulsée en oxygène"}, {"s": "SSSM", "t": "", "a": "Service de santé et de soins médicaux"}, {"s": "TA", "t": "", "a": "Tension artérielle"}, {"s": "TRC", "t": "", "a": "Temps de recoloration cutanée"}, {"s": "UMH", "t": "", "a": "Unité mobile hospitalière (ambulance du SAMU)"}, {"s": "USINV", "t": "", "a": "Unité de soins intensifs neuro-vasculaires"}, {"s": "VA", "t": "", "a": "Voies aériennes"}, {"s": "VHB", "t": "", "a": "Virus de l’hépatite B"}, {"s": "VHC", "t": "", "a": "Virus de l’hépatite C"}, {"s": "VIH", "t": "", "a": "Virus de l’immunodéficience humaine"}, {"s": "VTP", "t": "", "a": "Véhicule de transport de personnel"}];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9]+/g,' ').trim();
function variants(a){const v=new Set([norm(a),norm(a.replace(/\(.*?\)/g,''))]);const m=a.match(/\((.*?)\)/);if(m&&m[1]==='di')v.add(norm(a.replace(/[()]/g,''))),v.add(norm(a.replace(/\(di\)/,'')));return [...v].filter(Boolean)}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function isOk(it,val){const n=norm(val);if(!n)return false;return it.v.some(x=>n===x||lev(n,x)<=(x.length>=12?2:x.length>=6?1:0))}
DATA.forEach(it=>it.v=variants(it.a));
let order=DATA.map((_,i)=>i),rows=[];
const $=id=>document.getElementById(id);
function render(){
  const L=$('list');L.innerHTML='';rows=[];
  order.forEach(i=>{
    const it=DATA[i],r=document.createElement('div');r.className='row';
    r.innerHTML=`<div class="s">${it.s}${it.t?`<small>${it.t}</small>`:''}</div><input type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Signification…" aria-label="Signification de ${it.s}"><div class="b"><button class="h" title="Indice">Indice</button><button class="r" title="Voir la réponse">Réponse</button></div><div class="fb"></div>`;
    const inp=r.querySelector('input'),fb=r.querySelector('.fb');
    r._st=0;r._it=it;r._inp=inp;
    inp.addEventListener('input',()=>{r.className='row';r._st=0;fb.className='fb';upd()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(r);const n=rows[rows.indexOf(r)+1];if(n)n._inp.focus()}});
    inp.addEventListener('blur',()=>{if(inp.value.trim())check(r)});
    r.querySelector('.h').onclick=()=>{fb.className='fb h';fb.textContent='Indice : '+it.a.replace(/\(.*?\)/g,'').trim().split(/\s+/).map(w=>w[0]+'…').join(' ')+' ('+it.a.split(/\s+/).length+' mots)'};
    r.querySelector('.r').onclick=()=>{inp.value=it.a;check(r,true)};
    L.appendChild(r);rows.push(r);
  });
  upd();
}
function check(r,rev){
  const fb=r.querySelector('.fb'),ok=isOk(r._it,r._inp.value);
  r._st=ok?1:2;
  r.className='row '+(ok?'ok':'ko');
  fb.className='fb'+(ok?' sh':'');
  fb.innerHTML=ok?(rev?'<b>Réponse :</b> '+r._it.a:'<b>Exact.</b> '+r._it.a):'Pas tout à fait. Essaie encore, ou clique sur « Indice » ou « Réponse ».';
  upd();
}
function upd(){
  const n=rows.filter(r=>r._st===1).length;
  $('score').textContent=n+' / '+DATA.length;
  $('bar').style.width=(100*n/DATA.length)+'%';
  $('done').style.display=n===DATA.length?'block':'none';
  const only=$('only').checked;rows.forEach(r=>r.style.display=(only&&r._st===1)?'none':'');
}
$('chk').onclick=()=>rows.forEach(r=>{if(r._inp.value.trim())check(r)});
$('mix').onclick=()=>{const v=rows.map(r=>r._inp.value),m=new Map(rows.map(r=>[DATA.indexOf(r._it),r._inp.value]));order.sort(()=>Math.random()-.5);render();rows.forEach(r=>{const x=m.get(DATA.indexOf(r._it));if(x){r._inp.value=x;check(r)}})};
$('ord').onclick=()=>{const m=new Map(rows.map(r=>[DATA.indexOf(r._it),r._inp.value]));order=DATA.map((_,i)=>i);render();rows.forEach(r=>{const x=m.get(DATA.indexOf(r._it));if(x){r._inp.value=x;check(r)}})};
$('clr').onclick=()=>{render()};
$('only').onchange=upd;
render();
</script>
</body>
</html>
