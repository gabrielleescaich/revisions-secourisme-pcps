<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valeurs à deviner</title>
<style>
/* Layout: une colonne de cartes (une par question), chiffres à saisir dans le texte */
:root{--bg:#f4f6fa;--card:#fff;--fg:#1b2433;--mut:#5b6678;--line:#d5dbe6;--acc:#1f5fbf;--accfg:#fff;--ok:#1d7a46;--okbg:#e3f4ea;--ko:#b3261e;--kobg:#fbe7e5;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#18202e;--fg:#e8edf6;--mut:#9aa6ba;--line:#2c3649;--acc:#6ea2f5;--accfg:#0b1220;--ok:#6fd49a;--okbg:#14301f;--ko:#ff8a80;--kobg:#3a1815;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.6rem;line-height:1.2;margin:0;text-wrap:balance}
.intro{color:var(--mut);margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.score{font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;cursor:pointer;min-height:42px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.05rem;margin:0;text-wrap:balance}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
input.n{width:4.2em;font:inherit;font-variant-numeric:tabular-nums;text-align:center;padding:7px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);min-height:42px}
input.n.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:600}
input.n.ko{border-color:var(--ko);background:var(--kobg);color:var(--ko)}
.sol{font-size:.8rem;color:var(--ko);font-variant-numeric:tabular-nums}
.col{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
</style>
</head>
<body>
<main>
 <header>
  <h1>Valeurs à deviner</h1>
  <p class="intro">Complétez chaque texte avec les bons chiffres. Seuls les chiffres sont à trouver.</p>
 </header>
 <div class="bar">
  <div class="btns">
   <button class="p" id="chk">Vérifier</button>
   <button id="rev">Voir les réponses</button>
   <button id="rst">Recommencer</button>
  </div>
  <div class="score" id="sc" aria-live="polite"></div>
 </div>
 <div id="cards" style="display:flex;flex-direction:column;gap:16px"></div>
</main>
<script>
const Q=[
 {
  "q": "Fréquences cardiaques normales selon l'âge",
  "a": "Adulte : 60-100 battements/min\nEnfant : 70-140 battements/min\nNourrisson : 100-160 battements/min\nNouveau-né : 120-160 battements/min"
 },
 {
  "q": "Fréquences respiratoires normales selon l'âge",
  "a": "Adulte : 12-20 mouvements/min\nEnfant : 20-30 mouvements/min\nNourrisson : 30-40 mouvements/min\nNouveau-né : 40-60 mouvements/min"
 },
 {
  "q": "Nombre d'insufflations par minute en cas d'arrêt respiratoire",
  "a": "Adulte : 10 à 12 insufflations/min\nEnfant ou plus jeune : 12 à 20 insufflations/min"
 },
 {
  "q": "Sondes l'aspiration selon l'âge",
  "a": "Adulte : CH 18-26\nEnfant : CH 8-12\nNourrisson : CH 6-8\nNouveau-né : CH 4-6"
 },
 {
  "q": "SpO2 cible",
  "a": "Général : 94-98 % AA\nIRC : 89-94 % AA\nCOVID : 92-96 % AA"
 },
 {
  "q": "Valeurs de la glycémie capillaire indiquant une hypoglycémie",
  "a": "< 0,6 g/L\n< 3,3 mmol/L"
 },
 {
  "q": "Température par type d'hypothermie",
  "a": "Hypothermie légère : 32-35 °C\nHypothermie modérée : 28-32 °C\nHypothermie sévère : 24-28 °C\nHypothermie grave : < 24 °C"
 },
 {
  "q": "Nombre de secouristes par type de DPS",
  "a": "DPS-GE : 24-36 SR\nDPS-ME : 13-24 SR\nDPS-PE : 2-12 SR"
 }
];
const root=document.getElementById('cards');let inputs=[];
function build(){
 root.innerHTML='';inputs=[];
 Q.forEach(it=>{
  const c=document.createElement('section');c.className='card';
  const h=document.createElement('h2');h.textContent=it.q;c.appendChild(h);
  it.a.split('\n').forEach(l=>{
   const d=document.createElement('div');d.className='line';
   l.split(/(\d+(?:,\d+)?)/).forEach((p,i)=>{
    if(i%2){
     const w=document.createElement('span');w.className='col';
     const e=document.createElement('input');e.className='n';e.type='text';e.inputMode='decimal';e.maxLength=5;e.autocomplete='off';
     e.setAttribute('aria-label','Valeur à trouver');e.dataset.v=p;
     e.addEventListener('input',()=>{e.value=e.value.replace('.',',').replace(/[^\d,]/g,'');e.className='n';if(w.lastChild!==e)w.lastChild.remove();});
     e.addEventListener('keydown',k=>{if(k.key==='Enter'){k.preventDefault();const j=inputs.indexOf(e);(inputs[j+1]||document.getElementById('chk')).focus();}});
     w.appendChild(e);d.appendChild(w);inputs.push(e);
    }else if(p){const s=document.createElement('span');s.textContent=p;d.appendChild(s);}
   });
   c.appendChild(d);
  });
  root.appendChild(c);
 });
 score();
}
function score(t){document.getElementById('sc').textContent=t||('0 / '+inputs.length+' valeurs');}
document.getElementById('chk').onclick=()=>{
 let ok=0;
 inputs.forEach(e=>{
  const w=e.parentNode;if(w.lastChild!==e)w.lastChild.remove();
  if(e.value===''){e.className='n';return;}
  if(e.value===e.dataset.v){e.className='n ok';ok++;}
  else e.className='n ko';
 });
 score(ok+' / '+inputs.length+' valeurs'+(ok===inputs.length?' · bravo !':''));
};
document.getElementById('rev').onclick=()=>{
 inputs.forEach(e=>{
  const w=e.parentNode;if(w.lastChild!==e)w.lastChild.remove();
  if(e.value!==e.dataset.v){
   if(e.value!==''){const s=document.createElement('span');s.className='sol';s.textContent='vous : '+e.value;w.appendChild(s);}
   e.value=e.dataset.v;e.className='n ko';
  }else e.className='n ok';
 });
 score('Réponses affichées');
};
document.getElementById('rst').onclick=build;
build();
</script>
</body>
</html>
